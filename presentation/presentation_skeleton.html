<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JSMQL - a missing MongoDB query language</title>
    <style>
      :root {
        /* Light theme for a lit room, on MongoDB's own brand colours.
     Spring Green #00ED64 is the signature colour but fails as TEXT on white
     (~1.5:1), so it fills - rules, bars, highlights - and Forest Green #00684A
     carries every accent word. */
        --bg: #ffffff;
        --bg2: #f4f8f6;
        --panel: #f6faf8;
        --panel2: #eef5f1;
        --fg: #001e2b;
        --muted: #5c6c75;
        --dim: #5f6f78;
        --green: #00684a;
        --green2: #00ed64;
        --blue: #0b5fbd;
        --amber: #8a5a00;
        --red: #b42318;
        --purple: #6f2da8;
        --border: #dbe5e0;
        --border2: #bccdc5;
        /* Only the two fonts every OS ships, so the deck renders the same on the
     venue's machine as on yours: Arial for prose, Courier New for code. The
     generic families are the last-resort fallback only. */
        --mono: "Courier New", Courier, monospace;
        --sans: Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: #e8eeeb;
        overflow: hidden;
        font-family: var(--sans);
        color: var(--fg);
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 0%, #ffffff 0%, #e6ede9 70%);
      }
      #deck {
        width: 1280px;
        height: 720px;
        position: relative;
        transform-origin: center center;
        background: var(--bg);
        box-shadow: 0 18px 60px rgba(0, 30, 43, 0.16);
        overflow: hidden;
      }

      /* ---------- slides ---------- */
      .slide {
        position: absolute;
        inset: 0;
        padding: 56px 64px;
        display: none;
        flex-direction: column;
        background: linear-gradient(160deg, #ffffff 0%, #f4f8f6 100%);
      }
      .slide.on {
        display: flex;
      }
      .slide.tight {
        padding: 32px 44px;
      } /* code-heavy slides need the room */
      .step {
        opacity: 0;
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
        transform: translateY(6px);
      }
      .step.shown {
        opacity: 1;
        transform: none;
      }

      /* ---------- typography ---------- */
      h1 {
        font-size: 60px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 40px;
        line-height: 1.12;
        font-weight: 700;
        letter-spacing: -0.015em;
        margin-bottom: 6px;
      }
      h3 {
        font-size: 27px;
        font-weight: 600;
        color: var(--green);
        letter-spacing: 0.01em;
      }
      .kicker {
        font: 700 13px/1 var(--mono);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 20px;
      }
      .sub {
        font-size: 26px;
        color: var(--muted);
        line-height: 1.45;
        font-weight: 400;
      }
      .lead {
        font-size: 30px;
        line-height: 1.45;
        color: var(--fg);
      }
      p {
        font-size: 24px;
        line-height: 1.5;
        color: var(--muted);
      }
      strong {
        color: var(--fg);
        font-weight: 600;
      }
      em {
        color: var(--green);
        font-style: normal;
        font-weight: 600;
      }
      .big {
        color: var(--green);
        font-weight: 700;
      }
      a {
        color: var(--green);
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      li {
        font-size: 24px;
        line-height: 1.45;
        color: var(--muted);
        margin-bottom: 13px;
        padding-left: 26px;
        position: relative;
      }
      li::before {
        content: "▸";
        position: absolute;
        left: 0;
        color: var(--green);
        font-size: 18px;
        top: 3px;
      }
      li strong {
        color: var(--fg);
      }
      .todo {
        color: var(--amber);
        border-bottom: 1px dotted var(--amber);
        cursor: help;
      }

      /* ---------- title slide ---------- */
      .title-slide {
        justify-content: center;
      }
      .title-slide h1 {
        font-size: 70px;
        margin-bottom: 22px;
      }
      .title-slide h1 .jm {
        color: var(--green);
      }
      .title-slide .sub {
        font-size: 34px;
        max-width: 1100px;
        line-height: 1.35;
      }
      .title-slide .rule {
        margin: 28px 0;
      }
      .title-slide .links {
        margin-top: 30px;
        font-size: 24px;
        gap: 30px;
      }
      .rule {
        width: 70px;
        height: 4px;
        background: var(--green2);
        margin: 34px 0;
        border-radius: 2px;
      }
      .who {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 36px;
        color: var(--fg);
      }
      .who .role {
        color: var(--muted);
        font-size: 32px;
      }
      .who .at {
        color: var(--dim);
      }
      /* Flash Payments mark, sized to the line it sits on */
      .logo {
        width: 1.15em;
        height: 1.15em;
        vertical-align: -0.22em;
        margin-right: 0.34em;
        flex: none;
      }
      .links {
        margin-top: 26px;
        display: flex;
        gap: 26px;
        font: 700 15px/1 var(--mono);
        color: var(--dim);
        flex-wrap: wrap;
      }
      .links span {
        color: var(--green);
      }
      .variant-tag {
        position: absolute;
        top: 16px;
        right: 20px;
        font: 700 10px/1 var(--mono);
        letter-spacing: 0.14em;
        color: var(--amber);
        border: 1px solid var(--amber);
        padding: 5px 9px;
        border-radius: 3px;
        opacity: 0.75;
      }

      /* ---------- code ---------- */
      .code {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 15px;
        line-height: 1.36;
        white-space: pre;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px 18px;
        color: var(--fg);
        tab-size: 2;
      }
      .code::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .code::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 4px;
      }
      .code.sm {
        font-size: 13px;
        line-height: 1.36;
      }
      .code.xs {
        font-size: 11.5px;
        line-height: 1.32;
        padding: 9px 8px;
      }
      /* auto-fit: "text" shrinks the font until it fits; "scale" shrinks the whole
   block so an entire MQL wall is visible at once (unreadable, on purpose). */
      .code[data-fit="scale"] {
        overflow: hidden;
        transform-origin: top left;
      }
      /* "wall": the entire MQL laid out in N newspaper columns, scaled to fill the
   panel exactly. Reads as a slab of code rather than a thin ribbon. */
      /* columns are absolutely placed: `transform: scale()` does not affect layout,
   so flex would tile them by their UNSCALED width and push them off-panel. */
      .wall {
        position: relative;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        flex: 1;
        min-height: 0;
      }
      .wall pre {
        position: absolute;
        overflow: hidden;
        transform-origin: top left;
        background: none;
        border: 0;
        padding: 0;
        margin: 0;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.3;
        white-space: pre;
        /* The slab renders near 3px, where the eye reads DENSITY, not tokens.
             One ink colour at a heavier weight keeps it solid on white; syntax
             colour there only washes the lighter tokens out. The loupe re-renders
             the same line at readable size, in full colour. */
        color: var(--fg);
        font-weight: 700;
      }
      .wall pre span {
        color: inherit;
      }
      .wall pre .l {
        display: block;
      }
      .wall pre .l:empty::before {
        content: "\200b";
      }
      /* line-addressable code panel: one block span per line, so a step can light a
   range and scroll it into view. Used by the flip slide. */
      .code.lines {
        padding: 12px 0;
        overflow: auto;
        position: relative;
      }
      .lines .l {
        display: block;
        padding: 0 14px;
        border-left: 3px solid transparent;
      }
      .lines .l:empty::before {
        content: "\200b";
      } /* keep blank lines tall */
      .lines.dim .l {
        opacity: 0.5;
        transition: opacity 0.2s;
      }
      .lines .l.hot {
        opacity: 1;
        background: rgba(0, 237, 100, 0.3);
        border-left-color: var(--green);
      }
      /* Loupe: hovering a scaled-down MQL wall (or the flip slide's MQL) pops the
   code under the cursor up to a readable size. Lives inside #deck so it shares
   the deck's scale and reads at the same size as the slide's own code. */
      #loupe {
        position: absolute;
        z-index: 40;
        display: none;
        background: var(--panel2);
        border: 1px solid var(--green);
        border-radius: 7px;
        padding: 9px 12px;
        font: 700 13px/1.45 var(--mono);
        white-space: pre;
        pointer-events: none;
        box-shadow: 0 14px 46px rgba(0, 30, 43, 0.2);
        max-width: 660px;
        overflow: hidden;
      }
      #loupe.on {
        display: block;
      }
      /* .lw scrolls left/right to follow the cursor along a long line; .lin grows to
   the widest line so the .cur highlight spans the whole line, not just the box. */
      #loupe .lw {
        overflow: hidden;
        margin: 0 -12px;
      }
      #loupe .lin {
        display: inline-block;
        min-width: 100%;
        padding: 0 12px;
      }
      #loupe .cur {
        display: block;
        background: rgba(0, 237, 100, 0.3);
        box-shadow: inset 2px 0 0 var(--green);
        margin: 0 -12px;
        padding: 0 10px;
      }
      #loupe .lz {
        display: block;
      }
      #loupe .cap {
        display: block;
        margin-top: 7px;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        font: 700 10px/1 var(--mono);
        letter-spacing: 0.12em;
        color: var(--dim);
        text-transform: uppercase;
      }
      .panel-h {
        display: flex;
        align-items: center;
        gap: 9px;
        font: 700 14px/1 var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .dot.js {
        background: var(--blue);
      }
      .dot.mql {
        background: var(--amber);
      }
      .dot.sql {
        background: var(--purple);
      }
      .count {
        margin-left: auto;
        color: var(--dim);
        letter-spacing: 0.06em;
        font-weight: 700;
        text-transform: none;
      }

      /* syntax */
      .t-com {
        color: var(--dim);
        font-style: italic;
      }
      .t-str {
        color: #0a7d33;
      }
      .t-num {
        color: var(--amber);
      }
      .t-sig {
        color: var(--green);
        font-weight: 700;
      }
      .t-op {
        color: var(--blue);
      }
      .t-kw {
        color: var(--purple);
      }
      .t-fn {
        color: #0b5fbd;
      }
      .t-key {
        color: #5c6c75;
      }
      .t-pun {
        color: var(--dim);
      }

      /* ---------- layout helpers ---------- */
      /* minmax(0,1fr), not 1fr: a long unwrappable code line would otherwise raise the
   column's min-content width and blow the other columns out of the grid. */
      .two {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
        flex: 1;
        min-height: 0;
      }
      .three {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        flex: 1;
        min-height: 0;
      }
      .col {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .col .code {
        flex: 1;
        min-height: 0;
      }
      .body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .spread {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 44px;
        align-items: start;
      }
      .center {
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      /* stat blocks */
      .stats {
        display: flex;
        gap: 44px;
        align-items: flex-end;
      }
      .stat .n {
        font: 700 56px/1 var(--sans);
        color: var(--green);
        letter-spacing: -0.03em;
      }
      .stat .n.bad {
        color: var(--red);
      }
      .stat .l {
        font: 700 17px/1.3 var(--mono);
        color: var(--muted);
        letter-spacing: 0.09em;
        text-transform: uppercase;
        margin-top: 9px;
      }
      .arrow {
        font-size: 34px;
        color: var(--dim);
        align-self: center;
        padding-bottom: 16px;
      }

      /* section divider */
      .divider {
        justify-content: center;
        align-items: flex-start;
        background: linear-gradient(135deg, #f3f9f6 0%, #e7f1ec 100%);
      }
      .divider .num {
        font: 700 130px/1 var(--sans);
        color: var(--border2);
        letter-spacing: -0.05em;
        margin-bottom: 6px;
      }
      .divider h2 {
        font-size: 52px;
      }

      /* callout */
      .callout {
        border-left: 3px solid var(--green);
        background: rgba(0, 237, 100, 0.16);
        padding: 16px 20px;
        border-radius: 0 7px 7px 0;
      }
      .callout.warn {
        border-left-color: var(--amber);
        background: rgba(240, 180, 41, 0.2);
      }
      .callout.bad {
        border-left-color: var(--red);
        background: rgba(180, 35, 24, 0.09);
      }
      .callout p,
      .callout li {
        margin: 0;
        font-size: 24px;
      }
      .callout.compact {
        padding: 9px 15px;
      }
      .callout.compact p {
        font-size: 20px;
        line-height: 1.45;
      }
      .callout .code {
        margin-top: 10px;
        background: rgba(0, 30, 43, 0.04);
      }

      /* minimap for the MQL wall */
      .mini-wrap {
        position: relative;
        overflow: hidden;
        flex: 1;
        min-height: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .mini-wrap .code {
        border: 0;
        border-radius: 0;
        height: 100%;
        transition: none;
      }
      .mini-wrap.mini .code {
        transform-origin: top left;
        overflow: hidden;
        pointer-events: none;
        transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* pointer-events:none - it overlaps the last column, and would otherwise
   swallow the loupe's hit-test for the lines underneath it. */
      .mini-badge {
        pointer-events: none;
        position: absolute;
        right: 12px;
        bottom: 12px;
        font: 700 11px/1 var(--mono);
        letter-spacing: 0.1em;
        color: var(--amber);
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid var(--amber);
        padding: 7px 11px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.4s 0.5s;
      }
      .mini-wrap.mini .mini-badge {
        opacity: 1;
      }

      /* ---------- story / history / operator slides ---------- */
      .nulls {
        display: flex;
        gap: 34px;
        margin-top: 40px;
        font: 700 58px/1 var(--mono);
        color: var(--red);
        letter-spacing: -0.02em;
      }
      .nulls span {
        opacity: 0;
      }
      .nulls span.shown {
        opacity: 1;
      }
      .bigquote {
        margin: auto 0;
        max-width: 1100px;
      }
      .bigquote p {
        font-size: 58px;
        line-height: 1.12;
        font-weight: 700;
        color: var(--fg);
        letter-spacing: -0.02em;
      }
      .bigquote footer {
        margin-top: 22px;
        font: 500 24px/1.4 var(--sans);
        color: var(--muted);
      }
      /* operator table: idea | SQL | JSMQL - no MQL on these slides, on purpose */
      .ops {
        display: flex;
        flex-direction: column;
        gap: 7px;
        flex: 1;
        min-height: 0;
        font-family: var(--mono);
      }
      .oph,
      .oprow {
        display: grid;
        grid-template-columns: 150px minmax(0, 1.18fr) minmax(0, 1fr);
        gap: 16px;
        align-items: center;
      }
      .oph {
        font: 700 14px/1 var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 14px 6px;
        border-bottom: 1px solid var(--border);
      }
      .oph span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .oprow {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        flex: 1;
        min-height: 0;
      }
      .oprow .idea {
        font: 600 19px/1.3 var(--sans);
        color: var(--fg);
      }
      .oprow code {
        display: block;
        white-space: pre;
        font: 700 14px/1.4 var(--mono);
        color: var(--fg);
        overflow: hidden;
      }
      .oprow .jsc code {
        font-size: 15px;
      }
      .oprow .dl {
        display: grid;
        grid-template-columns: 104px 1fr;
        gap: 8px;
        align-items: baseline;
      }
      .oprow .dl + .dl {
        margin-top: 3px;
      }
      .dtag {
        font: 700 12px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--purple);
        background: rgba(111, 45, 168, 0.08);
        border: 1px solid rgba(111, 45, 168, 0.25);
        border-radius: 3px;
        padding: 3px 6px;
        white-space: nowrap;
        justify-self: start;
      }
      /* cliffhanger fan */
      .fan {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 8px;
        flex: 1;
        min-height: 0;
      }
      .fan-src {
        font-size: 17px;
        padding: 12px 18px;
        flex: 1;
        min-height: 0;
        width: auto;
        max-width: 100%;
      }
      .fan-lines {
        width: 1000px;
        max-width: 100%;
        height: 90px;
        flex: none;
        display: block;
      }
      .fan-lines path {
        fill: none;
        stroke: var(--green);
        stroke-width: 2.5;
      }
      .fan-lines path.dash {
        stroke: var(--border2);
        stroke-dasharray: 7 6;
      }
      .fan-row {
        flex: none;
        display: grid;
        grid-template-columns: repeat(5, 200px);
        width: 1000px;
        max-width: 100%;
      }
      .fan-box {
        justify-self: center;
        width: 176px;
        padding: 14px 12px;
        text-align: center;
        border-radius: 9px;
        border: 2px solid var(--green);
        background: rgba(0, 237, 100, 0.14);
      }
      .fan-box.dash {
        border-style: dashed;
        border-color: var(--border2);
        background: var(--panel);
      }
      .fan-box .nm {
        font-size: 20px;
        font-weight: 700;
        color: var(--fg);
      }
      .fan-box .nt {
        font: 700 12px/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 7px;
      }
      .fan-box.dash .nt {
        color: var(--dim);
      }
      /* close */
      .close {
        display: flex;
        flex-direction: column;
        gap: 22px;
        margin-top: 40px;
        max-width: 1100px;
      }
      .close .cl {
        font-size: 34px;
        line-height: 1.35;
        color: var(--muted);
      }
      .close .cl strong {
        color: var(--fg);
      }
      .close .thr {
        font-size: 36px;
        color: var(--fg);
        margin-top: 14px;
      }
      .close .ask {
        font-size: 40px;
        font-weight: 700;
        color: var(--green);
        margin-top: 14px;
      }
      /* JS -> MQL: two words and one arrow, the talk in one line */
      .bridge {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 46px;
      }
      .bridge .w {
        font: 700 168px/1 var(--sans);
        letter-spacing: -0.04em;
        color: var(--fg);
      }
      .bridge .arrow-big {
        color: var(--muted);
        flex: none;
      }
      /* the quoted author's portrait, top right */
      .portrait {
        position: absolute;
        top: 44px;
        right: 56px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--green2);
        box-shadow: 0 8px 28px rgba(0, 30, 43, 0.18);
      }
      /* result tables - what the query actually returned.
   No width: a table is shrink-to-fit by default, and align-self stops the flex
   column from stretching it. Header and cells share one alignment per column. */
      .res {
        border-collapse: collapse;
        font: 700 15px/1.25 var(--mono);
        align-self: flex-start;
        max-width: 100%;
      }
      .res th {
        font: 700 11px/1 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 14px 6px 0;
        border-bottom: 1px solid var(--border2);
        white-space: nowrap;
        text-align: left;
      }
      .res td {
        padding: 5px 14px 5px 0;
        color: var(--fg);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        text-align: left;
      }
      .res th.num,
      .res td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .res th:last-child,
      .res td:last-child {
        padding-right: 0;
      }
      .res tr:last-child td {
        border-bottom: 0;
      }
      .res i {
        color: var(--dim);
        font-style: italic;
      }
      .res .oid {
        color: var(--dim);
      }
      .res.sm {
        font-size: 13px;
      }
      .res.sm th {
        font-size: 10px;
      }
      .res.sm td {
        padding: 3px 12px 3px 0;
      }
      /* the flip slide gives every spare pixel to the two code panels */
      .res.tight {
        font-size: 12px;
      }
      .res.tight th {
        font-size: 9px;
        padding-bottom: 3px;
      }
      .res.tight td {
        padding: 1px 12px 1px 0;
      }
      /* The arrow from the query to its output. It is a ZERO-SIZE overlay: the box
   has no height (or no width, lying down), so it steals not one pixel of the
   slide, and the glyph is transformed up/left over the CODE - never the data.
   scaleX(4) scaleY(.5) is the squat, wide arrowhead. */
      .to-res {
        margin: 0;
        line-height: 0;
        overflow: visible;
        pointer-events: none;
        z-index: 3;
        color: var(--green2);
        font-weight: 700;
        text-shadow: 0 0 1px var(--green);
        display: flex;
      }
      /* line-height:1 gives the glyph a real box (the container stays 0). The nudge is
   in PIXELS and written LAST, so it is applied after the scale and is a true
   screen-space move - a percentage would resolve against the zero-height box.
   The squash is along the arrow's OWN axes: half as long, four times as thick.
   That is scaleY(.5) scaleX(4) pointing down, and the axes SWAP pointing right -
   scaleX(.5) scaleY(4) - or the arrow comes out stretched instead of squat. */
      /* The glyph is ABSOLUTE inside the zero-size box, anchored to the seam it sits
   on, and scaled toward that same edge - so all of its ink falls on the CODE
   side and none of it reaches the table. (Anchoring by flex alone collapsed the
   line box to zero height and split the ink 50/50 across the seam.) */
      .to-res span {
        position: absolute;
        display: block;
        line-height: 0;
      }
      .to-res span svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .to-res.down {
        height: 0;
        align-self: stretch;
        position: relative;
      }
      .to-res.down span {
        left: 26px;
        bottom: 6px;
        width: 60px;
        height: 15px;
      }
      .to-res.right {
        width: 0;
        align-self: center;
        position: relative;
      }
      .to-res.right span {
        right: 10px;
        top: -60px;
        width: 15px;
        height: 120px;
      }
      /* one SQL-vs-JSMQL idea per slide */
      .op-code {
        padding: 14px 20px;
        line-height: 1.35;
        margin-bottom: 12px;
      }
      .opd {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 18px;
        align-items: center;
      }
      .opd .dtag {
        font-size: 16px;
        padding: 6px 10px;
      }
      /* the three-products timeline on the history divider */
      .tl {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 34px;
      }
      .tl .row {
        display: grid;
        grid-template-columns: 230px 330px 1fr;
        gap: 22px;
        align-items: baseline;
      }
      .tl .yrs {
        font: 700 26px/1 var(--mono);
        color: var(--green);
        letter-spacing: -0.01em;
      }
      .tl .nm {
        font-size: 30px;
        font-weight: 700;
        color: var(--fg);
      }
      .tl .nt {
        font-size: 24px;
        color: var(--muted);
      }
      /* backup slides carry a tag so they can never be mistaken for the talk */
      .backup-tag {
        position: absolute;
        top: 16px;
        right: 20px;
        font: 700 10px/1 var(--mono);
        letter-spacing: 0.14em;
        color: var(--amber);
        border: 1px solid var(--amber);
        padding: 5px 9px;
        border-radius: 3px;
        opacity: 0.75;
        z-index: 6;
      }

      /* chrome */
      #bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--green2);
        width: 0;
        transition: width 0.25s ease;
        z-index: 5;
      }
      #num {
        position: absolute;
        right: 18px;
        bottom: 14px;
        font: 700 12px/1 var(--mono);
        color: var(--dim);
        z-index: 5;
        letter-spacing: 0.08em;
      }
      #brand {
        position: absolute;
        left: 20px;
        bottom: 13px;
        font: 700 12px/1 var(--mono);
        color: var(--border2);
        z-index: 5;
        letter-spacing: 0.1em;
      }

      /* overview */
      #ov {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.97);
        z-index: 50;
        display: none;
        overflow: auto;
        padding: 32px;
      }
      #ov.on {
        display: block;
      }
      #ov h4 {
        color: var(--green);
        font: 700 12px/1 var(--mono);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .ovgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
        gap: 11px;
      }
      .ovcard {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 14px;
        cursor: pointer;
        transition: 0.14s;
      }
      .ovcard:hover {
        border-color: var(--green);
        background: var(--panel2);
      }
      .ovcard .i {
        font: 700 10px/1 var(--mono);
        color: var(--dim);
        letter-spacing: 0.1em;
      }
      .ovcard .t {
        font-size: 14px;
        color: var(--fg);
        margin-top: 7px;
        line-height: 1.35;
        font-weight: 500;
      }
      .ovcard.variant {
        border-style: dashed;
        border-color: var(--amber);
      }
      .ovcard.variant .i {
        color: var(--amber);
      }

      /* notes */
      #notes {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 32vh;
        overflow: auto;
        background: #ffffff;
        border-top: 2px solid var(--green);
        padding: 16px 24px;
        z-index: 40;
        display: none;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
        white-space: pre-line;
      }
      #notes.on {
        display: block;
      }
      #notes b {
        color: var(--green);
        font: 700 11px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        display: block;
        margin-bottom: 8px;
      }
      #help {
        position: fixed;
        left: 14px;
        top: 14px;
        z-index: 60;
        font: 11px/1.7 var(--mono);
        color: var(--dim);
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--border);
        padding: 11px 14px;
        border-radius: 6px;
        display: none;
      }
      #help.on {
        display: block;
      }
      #help kbd {
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="deck"></div></div>
    <div id="ov">
      <h4>All slides - click to jump</h4>
      <div class="ovgrid" id="ovgrid"></div>
    </div>
    <div id="notes"></div>
    <div id="help"></div>

    <script id="examples" type="application/json">
      /*__EXAMPLES__*/
    </script>
    <script>
      /* ============================================================================
   JSMQL conference deck
   Every code sample below is injected from the #examples island, which was
   generated from files that were compiled by the real jsmql CLI and executed
   against a live mongod. Nothing here is hand-transcribed.
   ========================================================================= */

      const EX = JSON.parse(document.getElementById("examples").textContent);

      /* ---------------------------------------------------------------------------
   BIO - everything about you lives here. Edit once; all title variants update.
   Fields marked TODO are my guesses and render highlighted on the slide.
   ------------------------------------------------------------------------ */
      const BIO = {
        first: "Vasyl",
        surname: "", // "" → the title slide shows the first name only
        title: "CTO",
        company: "Flash Payments",
        what: "cross-border payments",
        npm: "npm: @koresar",
        repo: "github.com/flash-oss/jsmql",
        site: "jsmql.js.org",
        TODO: [], // any key listed here renders with a dotted amber underline
      };
      const fullName = BIO.surname ? BIO.first + " " + BIO.surname : BIO.first;
      const todo = (k, v) =>
        BIO.TODO.includes(k) ? `<span class="todo" title="Placeholder - edit BIO in the source">${v}</span>` : v;

      /* ---------------------------------------------------------------------------
   Syntax highlighting - self-contained, no CDN.
   ------------------------------------------------------------------------ */
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      /* ---------------------------------------------------------------------------
   Syntax highlighting - a character scanner, not a regex alternation.

   The previous regex version had a structural flaw: a greedy punctuation class
   ([^\w\s]+) consumed the opening quote of any string that directly followed
   punctuation, so `new Date("2026-07-10")` tokenised as ( " then numbers. A
   scanner cannot make that class of mistake, because each construct claims its
   own delimiters before anything else is considered.

   Contract: tokenise() is TOTAL and LOSSLESS - concatenating every token's text
   reproduces the input exactly. assertHighlighting() below enforces both.
   ------------------------------------------------------------------------ */
      const JS_KW = new Set([
        "const",
        "let",
        "var",
        "new",
        "delete",
        "return",
        "function",
        "if",
        "else",
        "in",
        "of",
        "typeof",
        "instanceof",
        "await",
        "async",
        "true",
        "false",
        "null",
        "undefined",
        "require",
      ]);
      const SQL_KW = new Set([
        "select",
        "from",
        "where",
        "group",
        "by",
        "order",
        "having",
        "join",
        "left",
        "right",
        "inner",
        "outer",
        "on",
        "as",
        "limit",
        "offset",
        "and",
        "or",
        "not",
        "in",
        "distinct",
        "with",
        "desc",
        "asc",
        "interval",
        "case",
        "when",
        "then",
        "else",
        "end",
        "union",
        "all",
        "is",
        "null",
        "exists",
        "over",
        "partition",
        "like",
        "varchar",
        "month",
        "day",
      ]);
      const SQL_FN = new Set([
        "sum",
        "count",
        "avg",
        "min",
        "max",
        "now",
        "coalesce",
        "to_char",
        "date_trunc",
        "extract",
        "string_agg",
        "row_number",
        "cast",
        "concat",
        "datediff",
        "datetrunc",
        "date_format",
        "regexp_like",
      ]);

      const isDigit = (c) => c >= "0" && c <= "9";
      const isWord = (c) => /[A-Za-z0-9_]/.test(c);
      const isIdent = (c) => /[A-Za-z_]/.test(c);

      // lang: "js" | "json" | "sql"
      function tokenise(src, lang) {
        const out = [];
        const n = src.length;
        let i = 0;
        const push = (cls, text) => out.push([cls, text]);

        while (i < n) {
          const c = src[i];

          // whitespace
          if (/\s/.test(c)) {
            let j = i;
            while (j < n && /\s/.test(src[j])) j++;
            push("", src.slice(i, j));
            i = j;
            continue;
          }

          // comments
          if (lang === "js" && c === "/" && src[i + 1] === "/") {
            let j = src.indexOf("\n", i);
            if (j < 0) j = n;
            push("t-com", src.slice(i, j));
            i = j;
            continue;
          }
          if (lang === "js" && c === "/" && src[i + 1] === "*") {
            let j = src.indexOf("*/", i + 2);
            j = j < 0 ? n : j + 2;
            push("t-com", src.slice(i, j));
            i = j;
            continue;
          }
          if (lang === "sql" && c === "-" && src[i + 1] === "-") {
            let j = src.indexOf("\n", i);
            if (j < 0) j = n;
            push("t-com", src.slice(i, j));
            i = j;
            continue;
          }

          // strings - claim their own delimiters, so no neighbour can steal a quote
          const quotes = lang === "sql" ? "'" : lang === "json" ? '"' : "\"'`";
          if (quotes.includes(c)) {
            let j = i + 1;
            while (j < n) {
              if (src[j] === "\\" && lang !== "sql") {
                j += 2;
                continue;
              }
              if (src[j] === c) {
                j++;
                break;
              }
              j++;
            }
            const text = src.slice(i, j);
            if (lang === "json") {
              // a string before ':' is a key
              let k = j;
              while (k < n && (src[k] === " " || src[k] === "\t")) k++;
              if (src[k] === ":") {
                push(text[1] === "$" ? "t-op" : "t-key", text);
                i = j;
                continue;
              }
            }
            push("t-str", text);
            i = j;
            continue;
          }

          // numbers (incl. 0x…, 1_000, 1.5); a leading '-' stays punctuation
          if (isDigit(c)) {
            let j = i;
            if (c === "0" && (src[i + 1] === "x" || src[i + 1] === "X")) {
              j = i + 2;
              while (j < n && /[0-9a-fA-F_]/.test(src[j])) j++;
            } else {
              while (j < n && /[0-9_]/.test(src[j])) j++;
              if (src[j] === "." && isDigit(src[j + 1])) {
                j++;
                while (j < n && /[0-9_]/.test(src[j])) j++;
              }
              if ((src[j] === "e" || src[j] === "E") && /[0-9+-]/.test(src[j + 1] || "")) {
                j++;
                if (src[j] === "+" || src[j] === "-") j++;
                while (j < n && isDigit(src[j])) j++;
              }
            }
            push("t-num", src.slice(i, j));
            i = j;
            continue;
          }

          // jsmql sigils and $-operators
          if (c === "$") {
            let j = i;
            while (j < n && src[j] === "$") j++;
            if (j < n && isIdent(src[j])) {
              // $match, $group, …
              let k = j;
              while (k < n && isWord(src[k])) k++;
              push("t-op", src.slice(i, k));
              i = k;
            } else {
              // $, $$, $$$, $$$$
              push("t-sig", src.slice(i, j));
              i = j;
            }
            continue;
          }

          // identifiers
          if (isIdent(c)) {
            let j = i;
            while (j < n && isWord(src[j])) j++;
            const word = src.slice(i, j);
            const lower = word.toLowerCase();
            let cls;
            if (lang === "sql") cls = SQL_KW.has(lower) ? "t-kw" : SQL_FN.has(lower) ? "t-fn" : "";
            else if (lang === "json") {
              let k = j;
              while (k < n && (src[k] === " " || src[k] === "\t")) k++;
              cls = src[k] === ":" ? "t-key" : /^(true|false|null|new)$/.test(word) ? "t-kw" : "t-fn";
            } else {
              let k = j;
              while (k < n && (src[k] === " " || src[k] === "\t")) k++;
              cls = JS_KW.has(word) ? "t-kw" : src[k] === "(" ? "t-fn" : "";
            }
            push(cls, word);
            i = j;
            continue;
          }

          // one punctuation character at a time - never swallows a following token
          push("t-pun", c);
          i++;
        }
        return out;
      }

      function paint(src, lang) {
        return tokenise(src, lang)
          .map(([cls, text]) => (cls ? `<span class="${cls}">${esc(text)}</span>` : esc(text)))
          .join("");
      }

      const hlJS = (s) => paint(s, "js");
      const hlJSON = (s) => paint(s, "json");
      const hlSQL = (s) => paint(s, "sql");

      const HL = { js: hlJS, mql: hlJSON, json: hlJSON, sql: hlSQL };
      const dig = (path) => path.split(".").reduce((o, k) => o?.[k], EX);

      /* ---------------------------------------------------------------------------
   Slide builders
   ------------------------------------------------------------------------ */
      const code = (langClass, path, extraClass = "", fit = "", group = "") =>
        `<pre class="code ${extraClass}" data-ex="${path}" data-lang="${langClass}"` +
        `${fit ? ` data-fit="${fit}"` : ""}${group ? ` data-fit-group="${group}"` : ""}></pre>`;

      // fit: "text"  → shrink font until every line is visible (readable panels)
      //      "wall"  → lay the whole thing out in N columns, scaled to fill the panel
      const panel = (kind, label, path, extraClass = "", countText = "", fit = "", group = "") => {
        const lang = kind === "sql" ? "sql" : kind === "mql" ? "mql" : "js";
        const body =
          fit === "wall"
            ? `<div class="wall" data-ex="${path}" data-lang="${lang}"></div>`
            : code(lang, path, extraClass, fit, group);
        return `
  <div class="col">
    <div class="panel-h"><span class="dot ${kind}"></span>${label}
      ${countText ? `<span class="count">${countText}</span>` : ""}</div>
    ${body}
  </div>`;
      };

      // A result table: the documents the query actually returned, from
      // examples/tables.json (written by tables.mjs, which runs each example on
      // the project's mongod). `cols` names the columns and their order.
      // A column is numeric when its FIRST value is - and then the header is
      // right-aligned with it, so the name sits directly above its digits.
      const table = (rows, cols, extraClass = "") => {
        if (!rows || !rows.length) return "";
        const num = (c) => typeof rows[0][c] === "number";
        const cell = (v) =>
          v == null
            ? "<i>null</i>"
            : typeof v === "number"
              ? v.toLocaleString("en-US")
              : v && typeof v === "object" && v.$oid
                ? `<span class="oid">${v.$oid.slice(-6)}</span>`
                : Array.isArray(v)
                  ? v.join(", ")
                  : esc(String(v));
        return `<table class="res ${extraClass}">
     <thead><tr>${cols.map((c) => `<th class="${num(c) ? "num" : ""}">${c}</th>`).join("")}</tr></thead>
     <tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${num(c) ? "num" : ""}">${cell(r[c])}</td>`).join("")}</tr>`).join("")}</tbody>
   </table>`;
      };

      // The arrow from the query to what it returned. "down" under a code panel,
      // "right" when the table sits beside one.
      // The arrow is DRAWN, not a glyph: a font arrow gives no control over the
      // stem/wing ratio. STEM is the stub's thickness, WING the wings' stroke -
      // a quarter of it. Both are in the 100-unit viewBox; the CSS sizes the box.
      const STEM = 56,
        WING = STEM / 4;
      // Each direction is DRAWN in its own coordinates. Rotating instead would
      // spin the non-uniform squash with it and turn the stub thin and long.
      const arrowSVG = (dir) => {
        const tip = 96,
          neck = tip - 34,
          half = 33;
        const d =
          dir === "right"
            ? { stem: `M2 50 H ${tip - WING / 2}`, wing: `M${neck} ${50 - half} L${tip} 50 L${neck} ${50 + half}` }
            : { stem: `M50 2 V ${tip - WING / 2}`, wing: `M${50 - half} ${neck} L50 ${tip} L${50 + half} ${neck}` };
        return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
     <path d="${d.stem}" stroke="currentColor" stroke-width="${STEM}" stroke-linecap="butt"/>
     <path d="${d.wing}" fill="none" stroke="currentColor"
           stroke-width="${WING}" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>`;
      };
      const toTable = (dir = "down") => `<div class="to-res ${dir}"><span>${arrowSVG(dir)}</span></div>`;

      // John A De Goes, from his own X profile - embedded as a data URI, so the

      const SLIDES = [];

      /* ---- 1. TITLE + BIO ------------------------------------------------------ */
      const titleHead = `
  <h1><span class="jm">JSMQL</span> - a missing<br>MongoDB query language</h1>
  <div class="sub">Compiling JS you already know to the MQL<br>for DB-side performance efficiency.</div>
  <div class="rule"></div>`;

      const LOGO = `<svg class="logo" viewBox="0 0 890 890" role="img" focusable="false">
  <title>Flash Payments</title>
  <path d="M75,0 H815 A75,75 0 0 1 890,75 V815 A75,75 0 0 1 815,890 H75 A75,75 0 0 1 0,815 V75 A75,75 0 0 1 75,0 Z" fill="#1D2870"/>

      const linksRow = `<div class="links">

</div>`;

   <div class="who"><strong>${fullName}</strong><span class="at">·</span>
     <span class="role">${BIO.title}, ${LOGO}${BIO.company}</span></div>
   ${linksRow}`,
        `Say your name and your title. Nothing else - the next slide IS the introduction.
   Under fifteen seconds here.`,
        { cls: "title-slide", title: "Title" },
      );

      /* ---- 2. THE FRIDAY -------------------------------------------------------- */
      // The story is spoken, not read. The screen carries the date, then one `null`
      // per key press as you say "Amend. Run. Null." - the room counts with you.
      S(
        `   <h1 style="font-size:82px;line-height:1.02">Friday,<br>20 December 2024.</h1>
   <p class="lead" style="margin-top:18px;color:var(--muted)">Last working day before Christmas.</p>
   <div class="nulls">
     ${[1, 2, 3, 4].map((i) => `<span class="step" data-step="${i}">null</span>`).join("")}
   </div>`,
        `THE STORY - first minute, scripted. Your words:

   Friday, the twentieth of December, 2024. Last working day before Christmas.

   We are a payments company. That morning the business needed to find specific addresses among
   millions of records. Business critical. Needed today. Smart search, not string comparison.

   MongoDB has text search. We do use it. But first, every address had to become one clean string -
   fullAddress. Ours lived in six fields. A lot of them were nulls, empty strings, or not even present.

   So I wrote the MQL query. Ran it. Every address: null.     [→ key: first null]
   Amended it. Ran it. Null.                                    [→]
   Amend. Run. Null.                                            [→]
   Amend. Run. Null.                                            [→]

   Four hours. Four hours on string concatenation!

   (The next slide shows the actual pipeline from that day.)

   The analysts got their answer the next month, when they came back from the Christmas break.
   We missed the deadline. We missed revenue.

   That evening I said: enough. Why should I spend Christmas Eve in a language nobody can read?`,
        { title: "Friday, 20 December 2024", steps: 4 },
      );

      /* ---- 3. WHAT FOUR HOURS BOUGHT ------------------------------------------- */
      S(
        `   <h2 style="margin-bottom:14px">What I thought in JS, and what I wrote in MQL</h2>
   <!-- The JSMQL is 11 short lines and needs ~370px; the 38-line MQL wall takes
        every pixel it is given, so the split is weighted towards it. -->
   <div class="two" style="grid-template-columns:0.68fr 1.32fr">
     <div class="col">
       <div class="panel-h"><span class="dot js"></span>JSMQL - what I thought
         <span class="count">${a.srcLines} lines</span></div>
       ${code("js", "addr.src", "sm", "text")}
       <div class="callout step" data-step="1" style="margin-top:16px">
         <p>There are still <strong>2 bugs</strong> in code on the right.</p>
       </div>
     </div>
     ${panel("mql", "MQL - what I wrote", "friday.mql", "xs", `${EX.friday.mqlLines} lines`, "wall")}
   </div>`,
        `This is THE query from the story - say so. Left: what I had in my head - the JavaScript every
   person in this room already writes. Right: the actual pipeline from that day, character for
   character (hover it - the loupe shows any part at full size). Ask: "who wants to code-review the
   right-hand side?" Wait for the laugh. Then: "that .filter(Boolean) is the four hours. Nulls, empty
   strings, missing fields. One word."
   If someone asks where the bug is: the $filter line - $ne ["$$field", ""] lets null through, and
   $concat with a null is null. I ran it again for this talk: an address with both buildings comes back
   "Level 3 Tower B , 42 George St Sydney AU" (note the space before the comma); any address with one
   building comes back null. The two sides are not the same query - the left is the address shape we
   use today - so do not claim they produce the same string.`,
        { title: "What I thought in JS, and what I wrote in MQL", steps: 1 },
      );

   into the wall - do not explain anything here. The next slide is the proof.`,

      //                      and all) in a column too narrow for its longest line.

      /* ---------------------------------------------------------------------------
   The flip slide: whole JSMQL on the left, whole MQL on the right, one
   construct lit at a time. Stage line-ranges are derived from the emitted
   document rather than hard-coded, so they follow the example if it changes.
   ------------------------------------------------------------------------ */
      function renderLinePanel(el) {
        if (el.dataset.built) return;
        const raw = dig(el.dataset.lines);
        if (raw == null) {
          el.textContent = "\u2039missing: " + el.dataset.lines + "\u203a";
          return;
        }
        const hl = HL[el.dataset.lang] || esc;
        el.innerHTML = raw
          .split("\n")
          .map((line, i) => `<span class="l" data-n="${i + 1}">${hl(line)}</span>`)
          .join("");
        el.dataset.built = "1";
      }

      // 1-indexed [from,to] line range of every top-level pipeline stage.
      function stageRanges(mql) {
        const out = [];
        let depth = 0,
          start = null,
          inStr = false;
        mql.split("\n").forEach((line, i) => {
          for (let k = 0; k < line.length; k++) {
            const ch = line[k];
            if (inStr) {
              if (ch === "\\") k++;
              else if (ch === '"') inStr = false;
              continue;
            }
            if (ch === '"') {
              inStr = true;
              continue;
            }
            if (ch === "{" || ch === "[") {
              depth++;
              if (depth === 2 && start === null) start = i;
            } else if (ch === "}" || ch === "]") {
              depth--;
              if (depth === 1 && start !== null) {
                out.push([start + 1, i + 1]);
                start = null;
              }
            }
          }
        });
        return out;
      }

      let FLIP_RANGES = null,
        FLIP_SRC = null;

      // Anchors, not line numbers: the example gets reformatted upstream, and a
      // hard-coded range silently highlights the wrong construct when it does.
      function resolveFlipSrc() {
        const lines = EX.wow.src.split("\n");
        return FLIP.map((f) => {
          const a = lines.findIndex((l) => l.includes(f.from));
          if (a < 0) return null;
          let b = a;
          for (let i = a; i < lines.length; i++)
            if (lines[i].includes(f.to)) {
              b = i;
              break;
            }
          return [a + 1, b + 1];
        });
      }
      function flipStep() {
        const src = document.getElementById("flipSrc"),
          mql = document.getElementById("flipMql");
        const pos = document.getElementById("flipPos");
        if (!src) return;
        renderLinePanel(src);
        renderLinePanel(mql);
        FLIP_RANGES = FLIP_RANGES || stageRanges(EX.wow.mql);
        FLIP_SRC = FLIP_SRC || resolveFlipSrc();

        const light = (el, from, to) =>
          el.querySelectorAll(".l").forEach((sp) => {
            const n = Number(sp.dataset.n);
            sp.classList.toggle("hot", n >= from && n <= to);
          });

        if (step < 1) {
          // both documents, nothing lit
          src.classList.remove("dim");
          mql.classList.remove("dim");
          light(src, 0, -1);
          light(mql, 0, -1);
          pos.textContent = `${EX.wow.mqlLines} lines · ${FLIP_RANGES.length} stages`;
          mql.scrollTop = 0;
          src.scrollTop = 0;
          return;
        }

        const f = FLIP[step - 1];
        const a = FLIP_RANGES[f.st[0]],
          b = FLIP_RANGES[f.st[1]];
        if (!a || !b) {
          // stage list moved under the mapping
          console.warn(`flip step ${step} points at stages ${f.st} but the MQL has ${FLIP_RANGES.length}`);
          src.classList.remove("dim");
          mql.classList.remove("dim");
          light(src, 0, -1);
          light(mql, 0, -1);
          return;
        }
        src.classList.add("dim");
        mql.classList.add("dim");
        const sr = FLIP_SRC[step - 1];
        if (sr) light(src, sr[0], sr[1]);
        else light(src, 0, -1);
        light(mql, a[0], b[1]);
        pos.textContent =
          f.st[0] === f.st[1]
            ? `stage ${f.st[0] + 1} of ${FLIP_RANGES.length} · lines ${a[0]}-${b[1]}`
            : `stages ${f.st[0] + 1}-${f.st[1] + 1} of ${FLIP_RANGES.length} · lines ${a[0]}-${b[1]}`;

        // Centre the lit block. offsetTop/offsetHeight are LAYOUT pixels, the same
        // units as scrollTop - getBoundingClientRect would return SCREEN pixels, and
        // #deck is CSS-scaled, so mixing the two drifts further the more you scroll.
        const hots = mql.querySelectorAll(".l.hot");
        if (hots.length) {
          const first = hots[0],
            last = hots[hots.length - 1];
          const blockTop = first.offsetTop;
          const blockH = last.offsetTop + last.offsetHeight - blockTop;
          const slack = Math.max(0, (mql.clientHeight - blockH) / 2);
          mql.scrollTop = Math.max(0, Math.min(blockTop - slack, mql.scrollHeight - mql.clientHeight));
        }
      }

      function fitOne(p) {
        if (p.dataset.fitDone) return;
        // Suppress scrollbars BEFORE measuring. A scrollbar that appears mid-shrink
        // steals 8px of clientWidth and then lingers after the content fits, showing
        // as a grey bar across the panel. scrollWidth/scrollHeight still report the
        // true content size with overflow:hidden, so the fit stays accurate.
        if (p.dataset.scroll) p.style.overflowX = "hidden";
        else p.style.overflow = "hidden";
        let size = parseFloat(getComputedStyle(p).fontSize);
        const overV = () => p.scrollHeight > p.clientHeight + 1;
        const overH = () => p.scrollWidth > p.clientWidth + 1;
        const mode = p.dataset.fit; // text | text2d | width
        const over = mode === "width" ? overH : mode === "text2d" ? () => overV() || overH() : overV;
        // Grow into spare room first, up to MAX_FIT. Without this a panel never
        // exceeds its CSS size, so a short example sits small beside a full one.
        const MAX_FIT = Number(p.dataset.max) || 17;
        while (!over() && size < MAX_FIT) {
          size += 0.25;
          p.style.fontSize = size + "px";
        }
        while (over() && size > 8) {
          size -= 0.25;
          p.style.fontSize = size + "px";
        }
        p.dataset.fitDone = "1";
      }
      // Operator rows: ONE font size for every SQL and JSMQL cell on the slide, shrunk
      // until the widest cell fits. Identical on purpose - the comparison is only fair
      // when both languages are set in the same size, and a row smaller than its
      // neighbours reads as "less important".
      function fitOps(slideEl) {
        const ops = slideEl.querySelector(".ops");
        if (!ops || ops.dataset.fitDone) return;
        const cells = [...ops.querySelectorAll(".sqlc code, .jsc code")];
        if (!cells.length) return;
        let size = 15;
        cells.forEach((c) => {
          c.style.fontSize = size + "px";
        });
        const over = () => cells.some((c) => c.scrollWidth > c.clientWidth + 1);
        while (over() && size > 10) {
          size -= 0.25;
          cells.forEach((c) => {
            c.style.fontSize = size + "px";
          });
        }
        ops.dataset.fitDone = "1";
      }
      function fitSlide(i) {
        SLIDES[i].el.querySelectorAll(".lines[data-lines]").forEach(renderLinePanel);
        fitOps(SLIDES[i].el);
        SLIDES[i].el.querySelectorAll("pre.code[data-fit]").forEach(fitOne);
        SLIDES[i].el.querySelectorAll(".wall[data-ex]").forEach(buildWall);
      }

      let cur = 0,
        step = 0;
      const bar = document.getElementById("bar"),
        numEl = document.getElementById("num");
      const notesEl = document.getElementById("notes"),
        ovEl = document.getElementById("ov");

      function maxStep(i) {
        return SLIDES[i].steps || 0;
      }

      function render() {
        SLIDES.forEach((s, i) => s.el.classList.toggle("on", i === cur));
        const s = SLIDES[cur];
        fitSlide(cur); // slide is visible now, so layout is real
        s.el.querySelectorAll(".step").forEach((e) => {
          e.classList.toggle("shown", Number(e.dataset.step) <= step);
        });
        bar.style.width = (Math.min(cur + 1, MAIN) / MAIN) * 100 + "%";
        numEl.textContent = s.backup ? "" : cur + 1 + " / " + MAIN;
        notesEl.innerHTML = s.notes ? "<b>Speaker notes - slide " + (cur + 1) + "</b>" + s.notes : "";
        location.hash = "/" + (cur + 1);
        if (s.wow) wowStep();
        if (s.flip) flipStep();
      }

      /* the slide-2 reveal: erupt → auto-scroll → snap to mini-map */
      function wowStep() {
        const wrap = document.getElementById("wowWrap"),
          wall = document.getElementById("wowWall");
        if (!wrap) return;
        const pre = wrap.querySelector(".code");
        if (step < 2) {
          wall.style.display = "none";
          pre.style.display = "";
          wrap.classList.remove("mini");
        }
        if (step < 1) {
          pre.scrollTop = 0;
          return;
        }
        if (step === 1) {
          // erupt, then scroll the whole wall past them
          const h = pre.scrollHeight - pre.clientHeight,
            t0 = performance.now(),
            DUR = 4200;
          (function frame(now) {
            if (!SLIDES[cur]?.wow || step !== 1) return;
            const p = Math.min(1, (now - t0) / DUR);
            pre.scrollTop = h * (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
            if (p < 1) requestAnimationFrame(frame);
          })(performance.now());
        }
        if (step >= 2) {
          // snap to the whole thing at once
          pre.style.display = "none";
          wall.style.display = "block";
          buildWall(wall);
          wrap.classList.add("mini");
        }
      }

      function go(d) {
        if (d > 0) {
          if (step < maxStep(cur)) step++;
          else if (cur < SLIDES.length - 1) {
            cur++;
            step = 0;
          } else return;
        } else {
          if (step > 0) step--;
          else if (cur > 0) {
            cur--;
            step = maxStep(cur);
          } else return;
        }
        render();
      }
      function jump(i) {
        cur = Math.max(0, Math.min(SLIDES.length - 1, i));
        step = 0;
        render();
      }

      /* ---------------------------------------------------------------------------
   Loupe. The MQL walls are scaled to roughly a quarter size (and the flip
   slide's MQL to 10px) on purpose - the point is to SEE the bulk. This lets you
   read any part of it by pointing at it, without changing what the slide looks
   like.
   ------------------------------------------------------------------------ */
      const loupe = document.createElement("div");
      loupe.id = "loupe";
      deck.appendChild(loupe);

      const CONTEXT = 6; // lines shown either side of the cursor

      // Which source line is under the cursor? Both walls and line-panels carry a
      // span per line, so this is an exact DOM hit-test rather than layout arithmetic
      // (which silently mis-maps whenever width, not height, is the binding constraint).
      function lineUnderCursor(el, cx, cy) {
        const hit = document.elementFromPoint(cx, cy);
        const line = hit && hit.closest && hit.closest(".l");
        if (!line || !el.contains(line)) return null;
        return line;
      }

      // Which character of that line is under the cursor? caretPositionFromPoint is
      // exact under any CSS scale, where arithmetic on font metrics would drift.
      function charUnderCursor(line, cx, cy) {
        let node, off;
        if (document.caretPositionFromPoint) {
          const p = document.caretPositionFromPoint(cx, cy);
          if (!p) return 0;
          node = p.offsetNode;
          off = p.offset;
        } else if (document.caretRangeFromPoint) {
          const r = document.caretRangeFromPoint(cx, cy);
          if (!r) return 0;
          node = r.startContainer;
          off = r.startOffset;
        } else return 0;
        if (!node || !line.contains(node)) return 0;
        if (node.nodeType !== 3) {
          // an element: count the text of the children before `off`
          let n = 0;
          for (let i = 0; i < off && i < node.childNodes.length; i++) n += node.childNodes[i].textContent.length;
          node = null;
          off = n;
          return off;
        }
        const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
        let n = 0,
          t;
        while ((t = walker.nextNode())) {
          if (t === node) return n + off;
          n += t.textContent.length;
        }
        return 0;
      }

      let LOUPE_CW = 0; // width of one loupe character, measured once
      function loupeCharWidth() {
        if (LOUPE_CW) return LOUPE_CW;
        const probe = document.createElement("span");
        probe.textContent = "0".repeat(100);
        probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
        loupe.appendChild(probe);
        LOUPE_CW = probe.getBoundingClientRect().width / 100 / (deck.getBoundingClientRect().width / 1280 || 1);
        loupe.removeChild(probe);
        return LOUPE_CW;
      }

      function showLoupe(el, cx, cy) {
        const raw = dig(el.dataset.ex || el.dataset.lines);
        if (raw == null) return hideLoupe();
        const line = lineUnderCursor(el, cx, cy);
        const lines = raw.split("\n");
        const idx = line ? Number(line.dataset.n) - 1 : -1;
        if (idx < 0 || idx >= lines.length) return hideLoupe();
        const ch = charUnderCursor(line, cx, cy);

        const from = Math.max(0, idx - CONTEXT),
          to = Math.min(lines.length, idx + CONTEXT + 1);
        const hl = HL[el.dataset.lang] || esc;
        loupe.innerHTML =
          `<div class="lw"><div class="lin">` +
          lines
            .slice(from, to)
            .map((l, i) => `<span class="${from + i === idx ? "cur" : "lz"}">${hl(l) || "&#8203;"}</span>`)
            .join("") +
          `</div></div><span class="cap">line ${idx + 1} of ${lines.length} · col ${ch + 1}</span>`;
        loupe.classList.add("on");

        // Pan the loupe so the character under the cursor sits ~40% in from its
        // left edge: sliding the mouse along a long line scrolls the magnified text.
        const lw = loupe.querySelector(".lw");
        const cw = loupeCharWidth();
        lw.scrollLeft = Math.max(0, Math.min(ch * cw - lw.clientWidth * 0.4, lw.scrollWidth - lw.clientWidth));

        // position in deck coordinates, flipped to stay on the slide
        const dr = deck.getBoundingClientRect(),
          s = dr.width / 1280 || 1;
        const px = (cx - dr.left) / s,
          py = (cy - dr.top) / s;
        const w = loupe.offsetWidth,
          h = loupe.offsetHeight;
        loupe.style.left = Math.max(8, Math.min(px + 24, 1280 - w - 8)) + "px";
        loupe.style.top = Math.max(8, Math.min(py - h / 2, 720 - h - 8)) + "px";
      }
      function hideLoupe() {
        loupe.classList.remove("on");
      }

      deck.addEventListener("mousemove", (e) => {
        const el =
          e.target.closest &&
          e.target.closest('.wall[data-ex][data-lang="mql"], pre.lines[data-lines][data-lang="mql"]');
        if (el) showLoupe(el, e.clientX, e.clientY);
        else hideLoupe();
      });
      deck.addEventListener("mouseleave", hideLoupe);

      addEventListener("keydown", (e) => {
        hideLoupe();
        const k = e.key;
        if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "ArrowDown") {
          e.preventDefault();
          go(1);
        } else if (k === "ArrowLeft" || k === "PageUp" || k === "ArrowUp") {
          e.preventDefault();
          go(-1);
        } else if (k === "[") {
          e.preventDefault();
          jump(cur - 1);
        } // whole slide back
        else if (k === "]") {
          e.preventDefault();
          jump(cur + 1);
        } // whole slide forward
        else if (k === "Home") {
          jump(0);
        } else if (k === "End") {
          jump(SLIDES.length - 1);
        } else if (k === "o" || k === "O") {
          ovEl.classList.toggle("on");
        } else if (k === "s" || k === "S") {
          notesEl.classList.toggle("on");
        } else if (k === "?" || k === "h" || k === "H") {
          document.getElementById("help").classList.toggle("on");
        } else if (k === "f" || k === "F") {
          document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        } else if (k === "Escape") {
          ovEl.classList.remove("on");
        } else if (/^[0-9]$/.test(k)) {
          /* type a number then Enter */ buf += k;
          return;
        } else if (k === "Enter" && buf) {
          jump(Number(buf) - 1);
          buf = "";
        }
      });
      let buf = "";

      /* overview */
      document.getElementById("ovgrid").innerHTML = SLIDES.map(
        (s, i) =>
          `<div class="ovcard ${s.backup ? "variant" : ""}" data-i="${i}">
     <div class="i">${String(i + 1).padStart(2, "0")}${s.backup ? " · BACKUP" : ""}</div>
     <div class="t">${s.title || "-"}</div>
   </div>`,
      ).join("");
      document.getElementById("ovgrid").addEventListener("click", (e) => {
        const c = e.target.closest(".ovcard");
        if (c) {
          ovEl.classList.remove("on");
          jump(Number(c.dataset.i));
        }
      });

      document.getElementById("help").innerHTML = `<kbd>→ / space</kbd> next step &nbsp; <kbd>←</kbd> back<br>
   <kbd>O</kbd> all slides &nbsp; <kbd>S</kbd> speaker notes<br>
   <kbd>[</kbd> <kbd>]</kbd> whole slide back / forward<br>
   <kbd>F</kbd> fullscreen &nbsp; <kbd>12↵</kbd> jump to slide<br>
   <kbd>hover</kbd> magnify any MQL wall<br>
   <kbd>?</kbd> hide this`;

      /* scale the fixed 1280×720 canvas to the viewport */
      function fit() {
        const s = Math.min(innerWidth / 1280, innerHeight / 720);
        deck.style.transform = "scale(" + s + ")";
      }
      addEventListener("resize", fit);
      fit();

      /* Fit every slide before the first render: a group must settle on one size
   across the whole deck, and fitting needs real layout. Also front-loads the
   MQL wall builds so no slide stutters the first time it is shown. */
      function prefitAll() {
        SLIDES.forEach((s, i) => {
          const wasOn = s.el.classList.contains("on");
          s.el.style.visibility = "hidden";
          s.el.classList.add("on");
          const hidden = [...s.el.querySelectorAll(".step:not(.shown)")];
          hidden.forEach((e) => e.classList.add("shown"));
          fitSlide(i);
          hidden.forEach((e) => e.classList.remove("shown"));
          if (!wasOn) s.el.classList.remove("on");
          s.el.style.visibility = "";
        });
        const groups = {};
        document.querySelectorAll("pre.code[data-fit-group]").forEach((p) => {
          (groups[p.dataset.fitGroup] = groups[p.dataset.fitGroup] || []).push(p);
        });
        for (const ps of Object.values(groups)) {
          const min = Math.min(...ps.map((p) => parseFloat(getComputedStyle(p).fontSize)));
          ps.forEach((p) => {
            p.style.fontSize = min + "px";
          });
        }
      }
      prefitAll();

      /* deep link */
      const m = location.hash.match(/^#\/(\d+)/);
      if (m) cur = Math.max(0, Math.min(SLIDES.length - 1, Number(m[1]) - 1));
      render();
      document.getElementById("help").classList.add("on");
      setTimeout(() => document.getElementById("help").classList.remove("on"), 5200);
    </script>
  </body>
</html>
