<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jsmql playground</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #666;
        --bg: #fafafa;
        --panel: #fff;
        --border: #e2e2e2;
        --accent: #2a6df4;
        --error: #c0392b;
        --error-bg: #fdf3f2;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      header strong {
        font-size: 14px;
      }

      header .tag {
        color: var(--muted);
      }

      header a {
        color: var(--accent);
        text-decoration: none;
      }

      header a:hover {
        text-decoration: underline;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        background: var(--panel);
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid var(--border);
      }

      .label {
        padding: 6px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .label label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: none;
        letter-spacing: normal;
        font-size: 11px;
        cursor: pointer;
      }

      .label input[type="checkbox"] {
        margin: 0;
      }

      .label select {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 4px;
        max-width: 320px;
      }

      .label button {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
      }

      .label button:hover {
        background: var(--bg);
      }

      .label button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .label .controls {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #output {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .CodeMirror {
        flex: 1;
        min-height: 0;
        height: auto;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
      }

      .CodeMirror-lines {
        padding: 14px 0;
      }

      pre.CodeMirror-line,
      pre.CodeMirror-line-like {
        padding-left: 16px;
        padding-right: 16px;
      }

      .panel.error .CodeMirror {
        background: var(--error-bg);
        color: var(--error);
        border-left: 3px solid var(--error);
      }

      .panel.error .CodeMirror-line,
      .panel.error .CodeMirror-line span {
        color: var(--error) !important;
      }

      .cm-error-marker {
        background: rgba(192, 57, 43, 0.18);
        border-bottom: 2px solid var(--error);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>jsmql playground</strong>
      <span class="tag">type an expression on the left, see the compiled MQL on the right</span>
      <a href="docs/LANGUAGE.md">syntax reference</a>
    </header>
    <main>
      <section class="panel">
        <div class="label">
          <span>jsmql input</span>
          <label
            >Examples
            <select id="example">
              <!-- BEGIN GENERATED OPTIONS -->
              <option value="order-eligibility-for-free-shipping" selected>e-commerce: order eligibility for free shipping</option>
              <option value="tiered-loyalty-discount-price">e-commerce: tiered loyalty discount price</option>
              <option value="seasonal-discount-with-eligibility-check">e-commerce: seasonal discount with eligibility check</option>
              <option value="discount-breakdown-via-iife-let">e-commerce: discount breakdown via IIFE → $let</option>
              <option value="cart-subtotal">e-commerce: cart subtotal</option>
              <option value="email-domain-extraction">user analytics: email domain extraction</option>
              <option value="score-normalisation">user analytics: score normalisation</option>
              <option value="age-decade-bucket">user analytics: age decade bucket</option>
              <option value="days-since-last-login">user analytics: days since last login</option>
              <option value="url-slug">content pipeline: URL slug</option>
              <option value="full-display-name-skipping-missing-parts">content pipeline: full display name (skipping missing parts)</option>
              <option value="lowercase-display-name">content pipeline: lowercase display name</option>
              <option value="formatted-date-label">reporting: formatted date label</option>
              <option value="days-since-document-was-created">reporting: days since document was created</option>
              <option value="stock-status-label">inventory: stock status label</option>
              <option value="reorder-alert">inventory: reorder alert</option>
              <option value="invoice-line-total-with-compound-tax">financial: invoice line total with compound tax</option>
              <option value="full-name-with-null-fallback">user display: full name with null fallback</option>
              <option value="full-address-formatter">location: full address formatter</option>
              <option value="csv-field-word-count">data quality: CSV field word count</option>
              <option value="normalise-string-vs-number-field">data quality: normalise string vs number field</option>
              <option value="admin-permission-check">access control: admin permission check</option>
              <option value="parameterised-threshold-query">jsmql template-tag form: parameterised threshold query</option>
              <option value="invoice-line-greeting-template-literal-optional-chain-startswith">invoice line greeting (template literal + optional chain + .startsWith)</option>
              <option value="analytics-flatmap-math-max-gettime">analytics — flatMap + Math.max + .getTime</option>
              <option value="shopping-cart-total-with-numeric-separators-reduce">shopping cart total with numeric separators + .reduce</option>
              <option value="pivot-table-row-computed-keys-object-fromentries">pivot table row (computed keys + Object.fromEntries)</option>
              <option value="flex-shape-accumulators-in-realistic-pipelines">flex-shape accumulators in realistic pipelines</option>
              <option value="file-upload-validation-includes-on-array-literal-endswith-numeric-separator">file upload validation (.includes on array literal + .endsWith + numeric separator)</option>
              <option value="score-range-with-spread-array-isarray-guard">score range with spread + Array.isArray guard</option>
              <option value="moderator-membership-check-with-array-spread">moderator membership check with array spread</option>
              <option value="days-since-event-date-now-gettime-numeric-separator">days since event (Date.now + .getTime + numeric separator)</option>
              <option value="audit-log-line-template-literal-toisostring-charat-touppercase">audit log line (template literal + .toISOString + .charAt + .toUpperCase)</option>
              <option value="tag-aggregation-flat-join">tag aggregation (.flat + .join)</option>
              <option value="scientific-projection-math-hypot-math-log2-log10-math-sign-math-cbrt-math-pi-e">scientific projection (Math.hypot + Math.log2/log10 + Math.sign + Math.cbrt + Math.PI/E)</option>
              <option value="dynamic-pivot-row-computed-key-in-literal-shorthand-property">dynamic pivot row (computed key in literal + shorthand property)</option>
              <option value="annotated-insurance-underwriting-rule-and-comments">annotated insurance underwriting rule (// and /* */ comments)</option>
              <option value="top-orders-report-by-department">pipeline: top-orders report by department</option>
              <option value="count-orders-by-status-per-shop-accumulator-replacement">pipeline: count orders by status per shop ($accumulator replacement)</option>
              <option value="invoice-finalisation-pipeline-mutations-match">e-commerce: invoice finalisation pipeline (mutations + $match)</option>
              <option value="invoice-finalisation-pipeline-implicit-form">e-commerce: invoice finalisation pipeline (implicit `;` form)</option>
              <!-- END GENERATED OPTIONS -->
            </select>
          </label>
        </div>
        <textarea
          id="input"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          autofocus
        ></textarea>
      </section>
      <section class="panel" id="output-panel">
        <div class="label">
          <span>MQL output (JSON)</span>
          <span class="controls">
            <label><input type="checkbox" id="prettify" checked /> Prettify</label>
            <button type="button" id="copy">Copy</button>
          </span>
        </div>
        <div id="output"></div>
      </section>
    </main>

    <!-- BEGIN GENERATED EXAMPLES -->
    <script type="text/plain" data-ex="order-eligibility-for-free-shipping">
      $.cart.total >= 50 &&
      $.customer.status in ["premium", "gold", "platinum"] &&
      $.cart.items.length < 20 &&
      $.customer.region.trim().toLowerCase() == "us"
    </script>

    <script type="text/plain" data-ex="tiered-loyalty-discount-price">
      $round(
        $.price * (
          $.loyalty.years >= 5 && $.loyalty.totalSpend >= 10000 ? 0.85 :
          $.loyalty.years >= 2 ? 0.92 : 1
        ),
        2
      )
    </script>

    <script type="text/plain" data-ex="seasonal-discount-with-eligibility-check">
      $.quantity > 1 && $.price >= 10 && $.category in ["sale", "clearance"]
        ? $.price * 0.8
        : $.price
    </script>

    <script type="text/plain" data-ex="discount-breakdown-via-iife-let">
      ((discount) => ({
        finalPrice: $.price - discount,
        savings: discount,
        savingsPercent: Math.round((discount / $.price) * 100),
      }))($.price * (1 - $.loyalty.multiplier))
    </script>

    <script type="text/plain" data-ex="cart-subtotal">
      $.items.map(item => item.qty * item.price).reduce((acc, x) => acc + x, 0)
    </script>

    <script type="text/plain" data-ex="email-domain-extraction">
      $.email.split("@").at(1).toLowerCase()
    </script>

    <script type="text/plain" data-ex="score-normalisation">
      ($.score - $.minScore) / ($.maxScore - $.minScore) * 100
    </script>

    <script type="text/plain" data-ex="age-decade-bucket">
      Math.floor($.age / 10) * 10
    </script>

    <script type="text/plain" data-ex="days-since-last-login">
      Math.abs($dateDiff({ startDate: $.lastLoginAt, endDate: new Date(), unit: 'day' }) ?? -1)
    </script>

    <script type="text/plain" data-ex="url-slug">
      String($.articleId) + "-" + $.title.toLowerCase().trim().replaceAll(" ", "-")
    </script>

    <script type="text/plain" data-ex="full-display-name-skipping-missing-parts">
      [$.firstName, $.middleName, $.lastName].filter(Boolean).join(" ")
    </script>

    <script type="text/plain" data-ex="lowercase-display-name">
      $toLower($.firstName + " " + $.lastName)
    </script>

    <script type="text/plain" data-ex="formatted-date-label">
      $dateToString({ date: $.publishedAt, format: "%Y-%m-%d" }) ??
      $dateToString({ date: $.createdAt, format: "%Y-%m-%d" }) ??
      "unknown"
    </script>

    <script type="text/plain" data-ex="days-since-document-was-created">
      $dateDiff({ startDate: $.createdAt, endDate: new Date(), unit: "day" })
    </script>

    <script type="text/plain" data-ex="stock-status-label">
      $.stock >= $.reorderPoint ? "ok" : $.stock > 0 ? "low" : "out-of-stock"
    </script>

    <script type="text/plain" data-ex="reorder-alert">
      !$.discontinued && $.stock < $.baseReorder * 2 ** $.urgencyLevel
    </script>

    <script type="text/plain" data-ex="invoice-line-total-with-compound-tax">
      $round($.quantity * ($.unitPrice + $.unitPrice * $.taxRate), 2)
    </script>

    <script type="text/plain" data-ex="full-name-with-null-fallback">
      $.firstName ?? $.aliases.at(0) ?? "anonymous"
    </script>

    <script type="text/plain" data-ex="full-address-formatter">
      [$.building && $.building + ",", $.streetNo, $.street, $.suburb, $.state, $.country, $.postcode]
        .filter(Boolean)
        .join(" ")
    </script>

    <script type="text/plain" data-ex="csv-field-word-count">
      $.tags.split(",").length
    </script>

    <script type="text/plain" data-ex="normalise-string-vs-number-field">
      typeof $.value == "string" ? $.value.trim() : String($.value)
    </script>

    <script type="text/plain" data-ex="admin-permission-check">
      $.active && $.role.toLowerCase().includes("admin") && $.name.trim().length > 0
    </script>

    <script type="text/plain" data-ex="parameterised-threshold-query">
      $.score >= 75 &&
      $.grade in ["A", "B"] &&
      $.submitted == true
    </script>

    <script type="text/plain" data-ex="invoice-line-greeting-template-literal-optional-chain-startswith">
      `Hi ${$.customer?.firstName ?? 'there'} — your ${$.invoice.id.startsWith('INV-VIP-') ? 'VIP ' : ''}invoice ${$.invoice.id} is ready`
    </script>

    <script type="text/plain" data-ex="analytics-flatmap-math-max-gettime">
      $.sessions
        .flatMap(s => s.events)
        .map(e => e.ts.getTime())
        .reduce((acc, t) => Math.max(acc, t), 0)
    </script>

    <script type="text/plain" data-ex="shopping-cart-total-with-numeric-separators-reduce">
      Math.min(10_000, $.lines.reduce((sum, l) => sum + l.qty * l.price, 0))
    </script>

    <script type="text/plain" data-ex="pivot-table-row-computed-keys-object-fromentries">
      Object.fromEntries($.metrics.map(m => [m.name, m.value]))
    </script>

    <script type="text/plain" data-ex="flex-shape-accumulators-in-realistic-pipelines">
      $round($sum($.lineTotal), 2)
    </script>

    <script type="text/plain" data-ex="file-upload-validation-includes-on-array-literal-endswith-numeric-separator">
      [".jpg", ".png", ".pdf", ".docx"].includes($.file.ext.toLowerCase()) &&
      $.file.name.endsWith($.file.ext) &&
      $.file.size <= 25_000_000
    </script>

    <script type="text/plain" data-ex="score-range-with-spread-array-isarray-guard">
      Array.isArray($.scores) ? Math.max(...$.scores) - Math.min(...$.scores) : 0
    </script>

    <script type="text/plain" data-ex="moderator-membership-check-with-array-spread">
      [...$.moderators, ...$.room.mods, "root"].includes($.userId)
    </script>

    <script type="text/plain" data-ex="days-since-event-date-now-gettime-numeric-separator">
      Math.floor((Date.now() - $.event.ts.getTime()) / 86_400_000)
    </script>

    <script type="text/plain" data-ex="audit-log-line-template-literal-toisostring-charat-touppercase">
      `${$.event.ts.toISOString()} [${$.event.level.charAt(0).toUpperCase()}] ${$.event.message}`
    </script>

    <script type="text/plain" data-ex="tag-aggregation-flat-join">
      $.posts.map(p => p.tags).flat().join(", ")
    </script>

    <script type="text/plain" data-ex="scientific-projection-math-hypot-math-log2-log10-math-sign-math-cbrt-math-pi-e">
      {
        distance: Math.hypot($.point.x - $.origin.x, $.point.y - $.origin.y),
        octave: Math.log2($.frequency / 440),
        decibels: Math.log10($.amplitude) * 20,
        fovRad: $.fovDeg * Math.PI / 180,
        growthFactor: Math.E ** $.rate,
        trend: Math.sign($.delta),
        cubeSide: Math.cbrt($.volume)
      }
    </script>

    <script type="text/plain" data-ex="dynamic-pivot-row-computed-key-in-literal-shorthand-property">
      $.products.map(p => ({ [p.category]: p.price, p }))
    </script>

    <script type="text/plain" data-ex="annotated-insurance-underwriting-rule-and-comments">
      // age window: 25 to 70 inclusive
      $.driver.age >= 25 && $.driver.age <= 70 &&

      /* annual mileage cap — 30k km/year keeps us out of commercial-fleet pricing */
      $.policy.kmPerYear <= 30_000 &&

      // hard-list occupations that bump the applicant to the high-risk tier
      !($.driver.occupation in ["stunt-double", "test-pilot", "demolition-engineer"])
    </script>

    <script type="text/plain" data-ex="top-orders-report-by-department">
      [
            $match($.status === "shipped" && $.placedAt >= "2026-01-01"),
            $lookup({ from: "users", localField: "userId", foreignField: "_id", as: "buyer" }),
            $unwind($.buyer),
            $group({ _id: $.buyer.department, revenue: $sum($.total), orders: $sum(1) }),
            $set({ avgOrder: $.revenue / $.orders }),
            $sort({ revenue: -1 }),
            $limit(3)
          ]
    </script>

    <script type="text/plain" data-ex="count-orders-by-status-per-shop-accumulator-replacement">
      [
            { $group: { _id: $.shopId, statuses: $push($.status) } },
            { $project: {
                counts: $.statuses.reduce((acc, s) => ({ ...acc, [s]: (acc[s] ?? 0) + 1 }), {})
            } }
          ]
    </script>

    <script type="text/plain" data-ex="invoice-finalisation-pipeline-mutations-match">
      [
            $match($.status === 'pending' && $.paidAt != null),
            $.lineTotal = $.qty * $.unitPrice,
            $.invoiceCount += 1,
            delete $.tempToken,
            delete $._processingState,
            $.status = 'complete'
          ]
    </script>

    <script type="text/plain" data-ex="invoice-finalisation-pipeline-implicit-form">
      [
            $match($.status === 'pending' && $.paidAt != null),
            $.lineTotal = $.qty * $.unitPrice,
            $.invoiceCount += 1,
            delete $.tempToken,
            delete $._processingState,
            $.status = 'complete'
          ]
    </script>
    <!-- END GENERATED EXAMPLES -->

    <script type="module">
      import { jsmql, validate } from "./dist/index.js";

      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const outputPanel = document.getElementById("output-panel");
      const prettify = document.getElementById("prettify");
      const example = document.getElementById("example");
      const copyBtn = document.getElementById("copy");

      const inputCm = CodeMirror.fromTextArea(inputEl, {
        mode: { name: "javascript" },
        theme: "neo",
        lineWrapping: true,
        tabSize: 2,
        indentUnit: 2,
      });

      const outputCm = CodeMirror(outputEl, {
        mode: { name: "javascript", json: true },
        theme: "neo",
        lineWrapping: true,
        readOnly: "nocursor",
        value: "",
      });

      function loadExample(key) {
        const block = document.querySelector(`script[data-ex="${key}"]`);
        if (!block) return "";
        const raw = block.textContent.replace(/^\n/, "").replace(/\n\s*$/, "");
        // The HTML formatter indents the contents of these blocks; strip the
        // common leading-whitespace prefix so the example shows up unindented.
        const lines = raw.split("\n");
        let minIndent = Infinity;
        for (const line of lines) {
          if (line.trim() === "") continue;
          const m = line.match(/^( *)/);
          if (m) minIndent = Math.min(minIndent, m[1].length);
        }
        if (!Number.isFinite(minIndent) || minIndent === 0) return raw;
        return lines.map((l) => l.slice(minIndent)).join("\n");
      }

      let errorMarker = null;
      function clearErrorMarker() {
        if (errorMarker) {
          errorMarker.clear();
          errorMarker = null;
        }
      }

      function highlightErrorAt(pos) {
        clearErrorMarker();
        const src = inputCm.getValue();
        if (src.length === 0) return;
        // Clamp positions past end-of-input back to the last character so the
        // marker is always visible (e.g. unterminated `$.x &&` points just
        // beyond the source).
        const safePos = Math.min(pos, src.length - 1);
        const from = inputCm.posFromIndex(safePos);
        const to = inputCm.posFromIndex(safePos + 1);
        errorMarker = inputCm.markText(from, to, { className: "cm-error-marker" });
      }

      function render() {
        const src = inputCm.getValue();
        if (src.trim() === "") {
          clearErrorMarker();
          outputCm.setValue("");
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputPanel.classList.remove("error");
          return;
        }
        const result = validate(src);
        if (result.valid) {
          clearErrorMarker();
          const indent = prettify.checked ? 2 : 0;
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputCm.setValue(JSON.stringify(jsmql(src), null, indent));
          outputPanel.classList.remove("error");
        } else {
          const e = result.errors[0];
          // CODEGEN_ERROR carries pos: 0 as a placeholder, not a real
          // location — only highlight when the position is meaningful.
          if (e.code === "SYNTAX_ERROR") highlightErrorAt(e.pos);
          else clearErrorMarker();
          outputCm.setOption("mode", null);
          outputCm.setValue(`${e.code} at position ${e.pos}\n\n${e.message}`);
          outputPanel.classList.add("error");
        }
      }

      inputCm.on("change", render);
      prettify.addEventListener("change", render);
      example.addEventListener("change", () => {
        inputCm.setValue(loadExample(example.value));
      });

      let copyResetTimer = null;
      copyBtn.addEventListener("click", async () => {
        const text = outputCm.getValue();
        if (text === "" || outputPanel.classList.contains("error")) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied!";
        } catch {
          copyBtn.textContent = "Copy failed";
        }
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          copyBtn.textContent = "Copy";
        }, 1200);
      });

      inputCm.setValue(loadExample(example.value));
    </script>
  </body>
</html>
