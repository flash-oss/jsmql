<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jsmql playground</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --subtle: #94a3b8;
        --bg: #fafafa;
        --panel: #fff;
        --sidebar-bg: #f6f7f9;
        --border: #e3e6ea;
        --border-strong: #d4d9e0;
        --accent: #2a6df4;
        --accent-soft: rgba(42, 109, 244, 0.1);
        --accent-soft-strong: rgba(42, 109, 244, 0.16);
        --expr: #2a6df4;
        --expr-soft: rgba(42, 109, 244, 0.1);
        --pipe: #b45309;
        --pipe-soft: rgba(217, 119, 6, 0.12);
        --pipe-strong: rgba(217, 119, 6, 0.22);
        --error: #c0392b;
        --error-bg: #fdf3f2;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      header strong {
        font-size: 14px;
      }

      header .tag {
        color: var(--muted);
      }

      header a {
        color: var(--accent);
        text-decoration: none;
      }

      header a:hover {
        text-decoration: underline;
      }

      header .spacer {
        flex: 1;
      }

      header .header-action {
        font-family: inherit;
        font-size: 12px;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      header .header-action:hover {
        border-color: var(--border-strong);
        background: var(--bg);
      }

      header .header-action .kbd {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--bg);
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 300px 1fr 1fr;
        min-height: 0;
        background: var(--panel);
      }

      main.sidebar-collapsed {
        grid-template-columns: 0 1fr 1fr;
      }

      main.sidebar-collapsed #sidebar {
        display: none;
      }

      /* Pin each panel to an explicit grid column so the layout survives the
         sidebar going `display: none` — without this, grid auto-placement
         flows the input panel into the now-empty first track (0 width) and
         the user sees only the output panel. */
      #sidebar {
        grid-column: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
      }

      #input-panel {
        grid-column: 2;
      }

      #output-panel {
        grid-column: 3;
      }

      .sidebar-top {
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar-bg);
      }

      .sidebar-title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .sidebar-title-row .title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
      }

      .sidebar-title-row .count {
        font-size: 11px;
        color: var(--subtle);
        font-variant-numeric: tabular-nums;
      }

      .search-wrap {
        position: relative;
      }

      .search-wrap::before {
        content: "";
        position: absolute;
        left: 9px;
        top: 50%;
        width: 12px;
        height: 12px;
        margin-top: -6px;
        background: no-repeat center / contain
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236b6b6b' stroke-width='1.6'><circle cx='7' cy='7' r='5'/><path d='m11 11 3 3'/></svg>");
        opacity: 0.8;
        pointer-events: none;
      }

      #search {
        width: 100%;
        font-family: inherit;
        font-size: 13px;
        padding: 7px 30px 7px 28px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
        -webkit-appearance: none;
        appearance: none;
      }

      #search::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }

      #search:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .search-kbd {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--bg);
        pointer-events: none;
      }

      #search:focus + .search-kbd {
        display: none;
      }

      .legend {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }

      .legend .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .legend .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .legend .dot.expression {
        background: var(--expr);
      }

      .legend .dot.pipeline {
        background: var(--pipe);
      }

      #example-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0 12px;
        scrollbar-gutter: stable;
      }

      .cat-group {
        padding: 4px 0;
      }

      .cat-group[hidden] {
        display: none;
      }

      .cat-heading {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--subtle);
        padding: 10px 14px 4px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .cat-heading .cat-count {
        color: var(--subtle);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .example-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 12px 6px 28px;
        font: inherit;
        font-size: 13px;
        text-align: left;
        background: transparent;
        border: 0;
        border-left: 3px solid transparent;
        color: var(--fg);
        cursor: pointer;
        position: relative;
        line-height: 1.35;
      }

      .example-item[hidden] {
        display: none;
      }

      .example-item::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--expr);
        opacity: 0.85;
      }

      .example-item.pipeline::before {
        background: var(--pipe);
      }

      .example-item:hover {
        background: var(--accent-soft);
      }

      .example-item.active {
        background: var(--accent-soft-strong);
        border-left-color: var(--accent);
        font-weight: 600;
      }

      .example-item.pipeline.active {
        border-left-color: var(--pipe);
        background: var(--pipe-soft);
      }

      .example-item.pipeline.active::before {
        background: var(--pipe);
      }

      .ex-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ex-kind {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 1px 5px;
        border-radius: 3px;
        flex-shrink: 0;
        color: var(--expr);
        background: var(--expr-soft);
      }

      .ex-kind.pipeline {
        color: var(--pipe);
        background: var(--pipe-soft);
      }

      #no-matches {
        padding: 24px 16px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        line-height: 1.5;
      }

      #no-matches[hidden] {
        display: none;
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid var(--border);
      }

      .panel.input-panel.pipeline .label {
        background: linear-gradient(180deg, var(--pipe-soft), var(--bg));
        border-bottom-color: var(--pipe-strong);
      }

      .label {
        padding: 8px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 36px;
      }

      .label .label-main {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .label .label-tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .label .current-title {
        font-size: 12px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .kind-pill {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        border-radius: 3px;
        flex-shrink: 0;
        color: var(--expr);
        background: var(--expr-soft);
      }

      .kind-pill.pipeline {
        color: var(--pipe);
        background: var(--pipe-soft);
      }

      .kind-pill[hidden] {
        display: none;
      }

      .label label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: none;
        letter-spacing: normal;
        font-size: 11px;
        cursor: pointer;
      }

      .label input[type="checkbox"] {
        margin: 0;
      }

      .label button {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
      }

      .label button:hover {
        background: var(--bg);
      }

      .label button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .label .controls {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #output {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .CodeMirror {
        flex: 1;
        min-height: 0;
        height: auto;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
      }

      .CodeMirror-lines {
        padding: 14px 0;
      }

      pre.CodeMirror-line,
      pre.CodeMirror-line-like {
        padding-left: 16px;
        padding-right: 16px;
      }

      .panel.error .CodeMirror {
        background: var(--error-bg);
        color: var(--error);
        border-left: 3px solid var(--error);
      }

      .panel.error .CodeMirror-line,
      .panel.error .CodeMirror-line span {
        color: var(--error) !important;
      }

      .cm-error-marker {
        background: rgba(192, 57, 43, 0.18);
        border-bottom: 2px solid var(--error);
      }

      @media (max-width: 880px) {
        main {
          grid-template-columns: 220px 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>jsmql playground</strong>
      <span class="tag">JavaScript-subset language for MongoDB aggregation expressions</span>
      <a href="docs/LANGUAGE.md">syntax reference</a>
      <span class="spacer"></span>
      <button
        type="button"
        class="header-action"
        id="toggle-sidebar"
        title="Toggle examples sidebar"
      >
        <span id="toggle-sidebar-label">Hide examples</span>
        <span class="kbd">⌘B</span>
      </button>
    </header>
    <main id="main">
      <aside id="sidebar" aria-label="Examples">
        <div class="sidebar-top">
          <div class="sidebar-title-row">
            <span class="title">Examples</span>
            <span class="count" id="example-count"></span>
          </div>
          <div class="search-wrap">
            <input
              id="search"
              type="search"
              placeholder="Search examples…"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              aria-label="Search examples"
            />
            <span class="search-kbd">⌘K</span>
          </div>
          <div class="legend" aria-hidden="true">
            <span class="legend-item"><span class="dot expression"></span>expression</span>
            <span class="legend-item"><span class="dot pipeline"></span>pipeline</span>
          </div>
        </div>
        <nav id="example-list" aria-label="Example navigation"></nav>
        <div id="no-matches" hidden>No examples match your search.</div>
      </aside>
      <section class="panel input-panel" id="input-panel">
        <div class="label">
          <span class="label-main">
            <span class="label-tag">jsmql input</span>
            <span class="current-title" id="current-title"></span>
            <span class="kind-pill" id="current-kind" hidden></span>
          </span>
        </div>
        <textarea
          id="input"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          autofocus
        ></textarea>
      </section>
      <section class="panel" id="output-panel">
        <div class="label">
          <span>MQL output (JSON)</span>
          <span class="controls">
            <label><input type="checkbox" id="prettify" checked /> Prettify</label>
            <button type="button" id="copy">Copy</button>
          </span>
        </div>
        <div id="output"></div>
      </section>
    </main>

    <script type="module">
      const { jsmql } = globalThis.JSMQL;

      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const outputPanel = document.getElementById("output-panel");
      const inputPanel = document.getElementById("input-panel");
      const prettify = document.getElementById("prettify");
      const copyBtn = document.getElementById("copy");
      const searchEl = document.getElementById("search");
      const listEl = document.getElementById("example-list");
      const noMatchesEl = document.getElementById("no-matches");
      const toggleSidebarBtn = document.getElementById("toggle-sidebar");
      const toggleSidebarLabel = document.getElementById("toggle-sidebar-label");
      const mainEl = document.getElementById("main");
      const currentTitleEl = document.getElementById("current-title");
      const currentKindEl = document.getElementById("current-kind");
      const countEl = document.getElementById("example-count");

      const inputCm = CodeMirror.fromTextArea(inputEl, {
        mode: { name: "javascript" },
        theme: "neo",
        lineWrapping: true,
        tabSize: 2,
        indentUnit: 2,
      });

      const outputCm = CodeMirror(outputEl, {
        mode: { name: "javascript", json: true },
        theme: "neo",
        lineWrapping: true,
        readOnly: "nocursor",
        value: "",
      });

      // Example queries live in test/realistic.test.ts. `scripts/sync-
      // playground.mjs` extracts the first jsmql(...) call from each top-
      // level describe and embeds the result — together with derived
      // category and kind metadata — in the #examples-data JSON block
      // above, so this file is self-sufficient with no fetches.
      const examples = new Map(); // slug → entry
      const itemEls = new Map(); // slug → button element
      let orderedSlugs = []; // render order
      let visibleSlugs = []; // current filtered order (for ↑/↓ nav)
      let activeSlug = null;

      function populateExamples() {
        const list = JSON.parse(document.getElementById("examples-data").textContent);
        const groups = new Map();
        // Categories appear in the sidebar in the order their first example
        // shows up in `examples-data`, which is `test/realistic.test.ts`'s
        // describe-order verbatim. Reorganise the test file and the sidebar
        // follows — no playground-side allow-list to keep in sync.
        for (const ex of list) {
          examples.set(ex.slug, ex);
          if (!groups.has(ex.category)) groups.set(ex.category, []);
          groups.get(ex.category).push(ex);
        }
        const cats = [...groups.keys()];

        const frag = document.createDocumentFragment();
        for (const cat of cats) {
          const section = document.createElement("section");
          section.className = "cat-group";
          section.dataset.category = cat;

          const heading = document.createElement("div");
          heading.className = "cat-heading";
          const catName = document.createElement("span");
          catName.className = "cat-name";
          catName.textContent = cat;
          const catCount = document.createElement("span");
          catCount.className = "cat-count";
          catCount.textContent = groups.get(cat).length;
          heading.append(catName, catCount);
          section.appendChild(heading);

          for (const ex of groups.get(cat)) {
            const item = document.createElement("button");
            item.type = "button";
            item.className = "example-item " + ex.kind;
            item.dataset.slug = ex.slug;

            const titleEl = document.createElement("span");
            titleEl.className = "ex-title";
            titleEl.textContent = ex.displayTitle;

            const kindEl = document.createElement("span");
            kindEl.className = "ex-kind " + ex.kind;
            kindEl.textContent = ex.kind === "pipeline" ? "PIPE" : "EXPR";

            item.append(titleEl, kindEl);
            item.addEventListener("click", () => {
              selectExample(ex.slug);
              inputCm.focus();
            });
            section.appendChild(item);
            itemEls.set(ex.slug, item);
            orderedSlugs.push(ex.slug);
          }
          frag.appendChild(section);
        }
        listEl.replaceChildren(frag);

        const pipelines = list.filter((e) => e.kind === "pipeline").length;
        const expressions = list.length - pipelines;
        countEl.textContent = `${list.length} (${expressions} expr · ${pipelines} pipe)`;
      }

      function selectExample(slug, { scroll = true } = {}) {
        const ex = examples.get(slug);
        if (!ex) return;
        activeSlug = slug;
        loadingFromList = true;
        inputCm.setValue(ex.query);
        loadingFromList = false;

        currentTitleEl.textContent = ex.displayTitle;
        currentKindEl.hidden = false;
        currentKindEl.className = "kind-pill " + ex.kind;
        currentKindEl.textContent = ex.kind === "pipeline" ? "PIPELINE" : "EXPRESSION";
        inputPanel.classList.toggle("pipeline", ex.kind === "pipeline");

        for (const [s, el] of itemEls) {
          el.classList.toggle("active", s === slug);
        }
        if (scroll) {
          const active = itemEls.get(slug);
          if (active) active.scrollIntoView({ block: "nearest" });
        }
      }

      // When the user freely edits the input, we no longer match a stored
      // example. Clear the active highlight so the sidebar reflects state.
      let loadingFromList = false;
      function clearActiveOnUserEdit() {
        if (loadingFromList || activeSlug == null) return;
        const ex = examples.get(activeSlug);
        if (!ex || inputCm.getValue() === ex.query) return;
        activeSlug = null;
        for (const el of itemEls.values()) el.classList.remove("active");
        currentTitleEl.textContent = "";
        currentKindEl.hidden = true;
        inputPanel.classList.remove("pipeline");
      }

      function filterList(rawQuery) {
        const q = rawQuery.trim().toLowerCase();
        visibleSlugs = [];
        let anyVisible = false;
        for (const groupEl of listEl.querySelectorAll(".cat-group")) {
          let groupHasMatch = false;
          for (const item of groupEl.querySelectorAll(".example-item")) {
            const slug = item.dataset.slug;
            const ex = examples.get(slug);
            const haystack =
              ex.displayTitle.toLowerCase() +
              " " +
              ex.category.toLowerCase() +
              " " +
              ex.kind +
              " " +
              ex.query.toLowerCase();
            const match = q === "" || haystack.includes(q);
            item.hidden = !match;
            if (match) {
              visibleSlugs.push(slug);
              groupHasMatch = true;
            }
          }
          groupEl.hidden = !groupHasMatch;
          if (groupHasMatch) anyVisible = true;
        }
        noMatchesEl.hidden = anyVisible;
      }

      function stepSelection(dir) {
        if (visibleSlugs.length === 0) return;
        const idx = activeSlug ? visibleSlugs.indexOf(activeSlug) : -1;
        let next;
        if (idx === -1) {
          next = dir > 0 ? 0 : visibleSlugs.length - 1;
        } else {
          next = (idx + dir + visibleSlugs.length) % visibleSlugs.length;
        }
        selectExample(visibleSlugs[next]);
      }

      searchEl.addEventListener("input", () => filterList(searchEl.value));
      searchEl.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          stepSelection(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          stepSelection(-1);
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (!activeSlug && visibleSlugs.length > 0) {
            selectExample(visibleSlugs[0]);
          }
          inputCm.focus();
        } else if (e.key === "Escape") {
          if (searchEl.value !== "") {
            searchEl.value = "";
            filterList("");
          } else {
            inputCm.focus();
          }
        }
      });

      // ⌘K / Ctrl+K focuses the example search from anywhere.
      // ⌘B / Ctrl+B toggles the sidebar.
      window.addEventListener("keydown", (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (!mod) return;
        const key = e.key.toLowerCase();
        if (key === "k") {
          e.preventDefault();
          // ⌘K means "go find an example" — auto-reveal the sidebar if it
          // was collapsed, otherwise focusing a `display: none` input is
          // a silent no-op.
          if (mainEl.classList.contains("sidebar-collapsed")) toggleSidebar();
          searchEl.focus();
          searchEl.select();
        } else if (key === "b") {
          e.preventDefault();
          toggleSidebar();
        }
      });

      function toggleSidebar() {
        const collapsed = mainEl.classList.toggle("sidebar-collapsed");
        toggleSidebarLabel.textContent = collapsed ? "Show examples" : "Hide examples";
        // CodeMirror caches the gutter width when first laid out; force a
        // refresh after the grid columns change so the editors re-measure.
        requestAnimationFrame(() => {
          inputCm.refresh();
          outputCm.refresh();
        });
      }
      toggleSidebarBtn.addEventListener("click", toggleSidebar);

      let errorMarker = null;
      function clearErrorMarker() {
        if (errorMarker) {
          errorMarker.clear();
          errorMarker = null;
        }
      }

      function highlightErrorAt(pos) {
        clearErrorMarker();
        const src = inputCm.getValue();
        if (src.length === 0) return;
        // Clamp positions past end-of-input back to the last character so the
        // marker is always visible (e.g. unterminated `$.x &&` points just
        // beyond the source).
        const safePos = Math.min(pos, src.length - 1);
        const from = inputCm.posFromIndex(safePos);
        const to = inputCm.posFromIndex(safePos + 1);
        errorMarker = inputCm.markText(from, to, { className: "cm-error-marker" });
      }

      // Fit-or-break JSON pretty-printer: keep nodes on one line up to 80
      // cols, only expanding when the compact form would overflow.
      function pretty(root) {
        const compact = (x) =>
          Array.isArray(x)
            ? "[" + x.map(compact).join(", ") + "]"
            : x && typeof x === "object"
              ? Object.keys(x).length
                ? "{ " +
                  Object.keys(x)
                    .map((k) => JSON.stringify(k) + ": " + compact(x[k]))
                    .join(", ") +
                  " }"
                : "{}"
              : JSON.stringify(x);
        const go = (v, i, c) => {
          const s = compact(v);
          if (c + s.length <= 80) return s;
          const pad = " ".repeat(i + 2);
          const close = "\n" + " ".repeat(i);
          if (Array.isArray(v))
            return "[\n" + v.map((x) => pad + go(x, i + 2, i + 2)).join(",\n") + close + "]";
          return (
            "{\n" +
            Object.keys(v)
              .map((k) => {
                const p = JSON.stringify(k) + ": ";
                return pad + p + go(v[k], i + 2, i + 2 + p.length);
              })
              .join(",\n") +
            close +
            "}"
          );
        };
        return go(root, 0, 0);
      }

      function render() {
        clearActiveOnUserEdit();
        const src = inputCm.getValue();
        if (src.trim() === "") {
          clearErrorMarker();
          outputCm.setValue("");
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputPanel.classList.remove("error");
          return;
        }
        const result = jsmql.validate(src);
        if (result.valid) {
          clearErrorMarker();
          const out = jsmql(src);
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputCm.setValue(prettify.checked ? pretty(out) : JSON.stringify(out));
          outputPanel.classList.remove("error");
        } else {
          const e = result.errors[0];
          // CODEGEN_ERROR carries pos: 0 as a placeholder, not a real
          // location — only highlight when the position is meaningful.
          if (e.code === "SYNTAX_ERROR") highlightErrorAt(e.pos);
          else clearErrorMarker();
          outputCm.setOption("mode", null);
          outputCm.setValue(`${e.code} at position ${e.pos}\n\n${e.message}`);
          outputPanel.classList.add("error");
        }
      }

      inputCm.on("change", render);
      prettify.addEventListener("change", render);

      let copyResetTimer = null;
      copyBtn.addEventListener("click", async () => {
        const text = outputCm.getValue();
        if (text === "" || outputPanel.classList.contains("error")) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied!";
        } catch {
          copyBtn.textContent = "Copy failed";
        }
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          copyBtn.textContent = "Copy";
        }, 1200);
      });

      populateExamples();
      filterList("");
      if (orderedSlugs.length > 0) selectExample(orderedSlugs[0], { scroll: false });
    </script>
  </body>
