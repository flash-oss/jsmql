<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jsmql playground</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --subtle: #94a3b8;
        --bg: #fafafa;
        --panel: #fff;
        --sidebar-bg: #f6f7f9;
        --border: #e3e6ea;
        --border-strong: #d4d9e0;
        --accent: #2a6df4;
        --accent-soft: rgba(42, 109, 244, 0.1);
        --accent-soft-strong: rgba(42, 109, 244, 0.16);
        --expr: #2a6df4;
        --expr-soft: rgba(42, 109, 244, 0.1);
        --pipe: #b45309;
        --pipe-soft: rgba(217, 119, 6, 0.12);
        --pipe-strong: rgba(217, 119, 6, 0.22);
        --filter: #047857;
        --filter-soft: rgba(4, 120, 87, 0.12);
        --filter-strong: rgba(4, 120, 87, 0.22);
        --error: #c0392b;
        --error-bg: #fdf3f2;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      header strong {
        font-size: 14px;
      }

      header .tag {
        color: var(--muted);
      }

      header a {
        color: var(--accent);
        text-decoration: none;
      }

      header a:hover {
        text-decoration: underline;
      }

      header .spacer {
        flex: 1;
      }

      header .header-action {
        font-family: inherit;
        font-size: 12px;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      header .header-action:hover {
        border-color: var(--border-strong);
        background: var(--bg);
      }

      header .header-action .kbd {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--bg);
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 300px 1fr 1fr;
        min-height: 0;
        background: var(--panel);
      }

      main.sidebar-collapsed {
        grid-template-columns: 0 1fr 1fr;
      }

      main.sidebar-collapsed #sidebar {
        display: none;
      }

      /* Pin each panel to an explicit grid column so the layout survives the
         sidebar going `display: none` — without this, grid auto-placement
         flows the input panel into the now-empty first track (0 width) and
         the user sees only the output panel. */
      #sidebar {
        grid-column: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
      }

      #input-panel {
        grid-column: 2;
      }

      #output-panel {
        grid-column: 3;
      }

      .sidebar-top {
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar-bg);
      }

      .sidebar-title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .sidebar-title-row .title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
      }

      .sidebar-title-row .count {
        font-size: 11px;
        color: var(--subtle);
        font-variant-numeric: tabular-nums;
      }

      .search-wrap {
        position: relative;
      }

      .search-wrap::before {
        content: "";
        position: absolute;
        left: 9px;
        top: 50%;
        width: 12px;
        height: 12px;
        margin-top: -6px;
        background: no-repeat center / contain
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236b6b6b' stroke-width='1.6'><circle cx='7' cy='7' r='5'/><path d='m11 11 3 3'/></svg>");
        opacity: 0.8;
        pointer-events: none;
      }

      #search {
        width: 100%;
        font-family: inherit;
        font-size: 13px;
        padding: 7px 30px 7px 28px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
        -webkit-appearance: none;
        appearance: none;
      }

      #search::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }

      #search:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .search-kbd {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--bg);
        pointer-events: none;
      }

      #search:focus + .search-kbd {
        display: none;
      }

      .legend {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }

      /* Each legend item is a toggle filter button. Clicking toggles its kind
         in the visible set; an empty visible set means "show all". */
      .legend .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 3px 9px 3px 7px;
        cursor: pointer;
        user-select: none;
      }

      .legend .legend-item:hover {
        background: var(--bg);
        border-color: var(--border-strong);
      }

      .legend .legend-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .legend .legend-item.active {
        color: var(--fg);
        border-color: currentColor;
        background: var(--bg);
      }

      .legend .legend-item.filter.active {
        color: var(--filter);
        background: var(--filter-soft);
      }

      .legend .legend-item.pipeline.active {
        color: var(--pipe);
        background: var(--pipe-soft);
      }

      .legend .legend-item.expression.active {
        color: var(--expr);
        background: var(--expr-soft);
      }

      .legend .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .legend .dot.expression {
        background: var(--expr);
      }

      .legend .dot.pipeline {
        background: var(--pipe);
      }

      .legend .dot.filter {
        background: var(--filter);
      }

      #example-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0 12px;
        scrollbar-gutter: stable;
      }

      .cat-group {
        padding: 4px 0;
      }

      .cat-group[hidden] {
        display: none;
      }

      .cat-heading {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--subtle);
        padding: 10px 14px 4px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .cat-heading .cat-count {
        color: var(--subtle);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      /* Sub-header shown only when a describe carries 2+ `it()` examples. */
      .describe-heading {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        padding: 6px 14px 2px 16px;
      }

      .describe-heading[hidden] {
        display: none;
      }

      .example-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 12px 6px 28px;
        font: inherit;
        font-size: 13px;
        text-align: left;
        background: transparent;
        border: 0;
        border-left: 3px solid transparent;
        color: var(--fg);
        cursor: pointer;
        position: relative;
        line-height: 1.35;
      }

      .example-item[hidden] {
        display: none;
      }

      .example-item::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--expr);
        opacity: 0.85;
      }

      .example-item.pipeline::before {
        background: var(--pipe);
      }

      .example-item:hover {
        background: var(--accent-soft);
      }

      .example-item.active {
        background: var(--accent-soft-strong);
        border-left-color: var(--accent);
        font-weight: 600;
      }

      .example-item.pipeline.active {
        border-left-color: var(--pipe);
        background: var(--pipe-soft);
      }

      .example-item.pipeline.active::before {
        background: var(--pipe);
      }

      .ex-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ex-kind {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 1px 5px;
        border-radius: 3px;
        flex-shrink: 0;
        color: var(--expr);
        background: var(--expr-soft);
      }

      .ex-kind.pipeline {
        color: var(--pipe);
        background: var(--pipe-soft);
      }

      .ex-kind.filter {
        color: var(--filter);
        background: var(--filter-soft);
      }

      #no-matches {
        padding: 24px 16px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        line-height: 1.5;
      }

      #no-matches[hidden] {
        display: none;
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid var(--border);
      }

      .panel.input-panel.pipeline .label {
        background: linear-gradient(180deg, var(--pipe-soft), var(--bg));
        border-bottom-color: var(--pipe-strong);
      }

      .panel.input-panel.filter .label {
        background: linear-gradient(180deg, var(--filter-soft), var(--bg));
        border-bottom-color: var(--filter-strong);
      }

      /* "MongoDB call" hint shown above the editor, directly below the grey
         "jsmql input" label. The kind-coloured strip on the left mirrors the
         example's kind so a user scanning the playground can connect the
         label → call site → input → output at a glance. */
      .usage-bar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar-bg);
        font-size: 12px;
        overflow-x: auto;
        white-space: nowrap;
        flex-shrink: 0;
        border-left: 3px solid var(--expr);
      }

      .panel.input-panel.pipeline .usage-bar {
        border-left-color: var(--pipe);
      }

      .panel.input-panel.filter .usage-bar {
        border-left-color: var(--filter);
      }

      .usage-bar[hidden] {
        display: none;
      }

      .usage-bar .usage-label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        flex-shrink: 0;
      }

      .usage-bar .usage-code {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg);
        min-width: 0;
      }

      .label {
        padding: 8px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 36px;
      }

      .label .label-main {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .label .label-tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .label .current-title {
        font-size: 12px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .kind-pill {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        border-radius: 3px;
        flex-shrink: 0;
        color: var(--expr);
        background: var(--expr-soft);
      }

      .kind-pill.pipeline {
        color: var(--pipe);
        background: var(--pipe-soft);
      }

      .kind-pill.filter {
        color: var(--filter);
        background: var(--filter-soft);
      }

      .kind-pill[hidden] {
        display: none;
      }

      .label label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: none;
        letter-spacing: normal;
        font-size: 11px;
        cursor: pointer;
      }

      .label input[type="checkbox"] {
        margin: 0;
      }

      .label button {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
      }

      .label button:hover {
        background: var(--bg);
      }

      .label button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .label .controls {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #output {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .CodeMirror {
        flex: 1;
        min-height: 0;
        height: auto;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
      }

      .CodeMirror-lines {
        padding: 14px 0;
      }

      pre.CodeMirror-line,
      pre.CodeMirror-line-like {
        padding-left: 16px;
        padding-right: 16px;
      }

      .panel.error .CodeMirror {
        background: var(--error-bg);
        color: var(--error);
        border-left: 3px solid var(--error);
      }

      .panel.error .CodeMirror-line,
      .panel.error .CodeMirror-line span {
        color: var(--error) !important;
      }

      .cm-error-marker {
        background: rgba(192, 57, 43, 0.18);
        border-bottom: 2px solid var(--error);
      }

      @media (max-width: 880px) {
        main {
          grid-template-columns: 220px 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>jsmql playground</strong>
      <span class="tag">JavaScript-subset language for MongoDB aggregation expressions</span>
      <a href="docs/LANGUAGE.md">syntax reference</a>
      <span class="spacer"></span>
      <button
        type="button"
        class="header-action"
        id="toggle-sidebar"
        title="Toggle examples sidebar"
      >
        <span id="toggle-sidebar-label">Hide examples</span>
        <span class="kbd">⌘B</span>
      </button>
    </header>
    <main id="main">
      <aside id="sidebar" aria-label="Examples">
        <div class="sidebar-top">
          <div class="sidebar-title-row">
            <span class="title">Examples</span>
            <span class="count" id="example-count"></span>
          </div>
          <div class="search-wrap">
            <input
              id="search"
              type="search"
              placeholder="Search examples…"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              aria-label="Search examples"
            />
            <span class="search-kbd">⌘K</span>
          </div>
          <div class="legend" role="group" aria-label="Filter examples by kind">
            <button
              type="button"
              class="legend-item filter"
              data-kind="filter"
              aria-pressed="false"
            >
              <span class="dot filter"></span>filter
            </button>
            <button
              type="button"
              class="legend-item pipeline"
              data-kind="pipeline"
              aria-pressed="false"
            >
              <span class="dot pipeline"></span>pipeline
            </button>
            <button
              type="button"
              class="legend-item expression"
              data-kind="expression"
              aria-pressed="false"
            >
              <span class="dot expression"></span>expression
            </button>
          </div>
        </div>
        <nav id="example-list" aria-label="Example navigation"></nav>
        <div id="no-matches" hidden>No examples match your search.</div>
      </aside>
      <section class="panel input-panel" id="input-panel">
        <div class="label">
          <span class="label-main">
            <span class="label-tag">jsmql input</span>
            <span class="current-title" id="current-title"></span>
            <span class="kind-pill" id="current-kind" hidden></span>
          </span>
        </div>
        <div class="usage-bar" id="usage-bar" hidden>
          <span class="usage-label">MongoDB call:</span>
          <code class="usage-code" id="usage-code"></code>
        </div>
        <textarea
          id="input"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          autofocus
        ></textarea>
      </section>
      <section class="panel" id="output-panel">
        <div class="label">
          <span>MQL output (JSON)</span>
          <span class="controls">
            <label><input type="checkbox" id="prettify" checked /> Prettify</label>
            <button type="button" id="copy">Copy</button>
          </span>
        </div>
        <div id="output"></div>
      </section>
    </main>

    <!-- jsmql-examples:end -->

    <script type="module">
      const { jsmql } = globalThis.JSMQL;

      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const outputPanel = document.getElementById("output-panel");
      const inputPanel = document.getElementById("input-panel");
      const prettify = document.getElementById("prettify");
      const copyBtn = document.getElementById("copy");
      const searchEl = document.getElementById("search");
      const listEl = document.getElementById("example-list");
      const noMatchesEl = document.getElementById("no-matches");
      const toggleSidebarBtn = document.getElementById("toggle-sidebar");
      const toggleSidebarLabel = document.getElementById("toggle-sidebar-label");
      const mainEl = document.getElementById("main");
      const currentTitleEl = document.getElementById("current-title");
      const currentKindEl = document.getElementById("current-kind");
      const countEl = document.getElementById("example-count");
      const usageEl = document.getElementById("usage-bar");
      const usageCodeEl = document.getElementById("usage-code");

      const inputCm = CodeMirror.fromTextArea(inputEl, {
        mode: { name: "javascript" },
        theme: "neo",
        lineWrapping: true,
        tabSize: 2,
        indentUnit: 2,
      });

      const outputCm = CodeMirror(outputEl, {
        mode: { name: "javascript", json: true },
        theme: "neo",
        lineWrapping: true,
        readOnly: "nocursor",
        value: "",
      });

      // Example queries live in test/realistic.test.ts. `scripts/sync-
      // playground.mjs` extracts the first jsmql(...) call from each top-
      // level describe and embeds the result — together with derived
      // category and kind metadata — in the #examples-data JSON block
      // above, so this file is self-sufficient with no fetches.
      const examples = new Map(); // slug → entry
      const itemEls = new Map(); // slug → button element
      let orderedSlugs = []; // render order
      let visibleSlugs = []; // current filtered order (for ↑/↓ nav)
      let activeSlug = null;
      // Tracks which jsmql entry point compiles the editor contents. Updated
      // BEFORE `inputCm.setValue` inside `selectExample` so the synchronous
      // `change`-triggered `render()` already sees the new value — otherwise
      // every example renders with the PREVIOUS example's compile mode and
      // the MQL OUTPUT panel looks one step behind. After the user freely
      // edits the input the value stays sticky (so editing an Expression
      // example keeps producing aggregation-expression output); the editor
      // going empty resets it.
      //
      // Compile mode is the ONLY playground state that influences the
      // generated MQL — the output itself is recomputed from the input on
      // every `change` event and never cached.
      let currentCall = "jsmql";

      function populateExamples() {
        // Manifest is now an array of describes, each with its own `features`
        // tag list and an `its` array. Sidebar layout:
        //
        //   <Feature header>   (top-level grouping by describe.features[0])
        //     <describe label, clickable>            (when describe has 1 it)
        //     <describe sub-header>                  (when describe has 2+ its)
        //       <it title, clickable>
        //       <it title, clickable>
        //
        // `examples` map is keyed by `it.slug` (what the URL hash and the
        // ↑/↓ navigation use), and carries the parent describe's title so
        // the editor label can fall back to it when the it title is generic.
        const list = JSON.parse(document.getElementById("examples-data").textContent);
        const groups = new Map();
        let itCount = 0;
        for (const d of list) {
          const feature = (d.features && d.features[0]) || "Other";
          if (!groups.has(feature)) groups.set(feature, []);
          groups.get(feature).push(d);
          for (const it of d.its) {
            examples.set(it.slug, {
              ...it,
              describeTitle: d.title,
              features: d.features || [],
              displayTitle: d.its.length === 1 ? d.title : it.title,
            });
            itCount += 1;
          }
        }

        const frag = document.createDocumentFragment();
        for (const [feature, describes] of groups) {
          const section = document.createElement("section");
          section.className = "cat-group";
          section.dataset.category = feature;

          const heading = document.createElement("div");
          heading.className = "cat-heading";
          const catName = document.createElement("span");
          catName.className = "cat-name";
          catName.textContent = feature;
          const catCount = document.createElement("span");
          catCount.className = "cat-count";
          // Count the underlying its, not describes — the user clicks an it.
          catCount.textContent = describes.reduce((sum, d) => sum + d.its.length, 0);
          heading.append(catName, catCount);
          section.appendChild(heading);

          for (const d of describes) {
            const renderItem = (label, it) => {
              const item = document.createElement("button");
              item.type = "button";
              item.className = "example-item " + it.kind;
              item.dataset.slug = it.slug;
              item.dataset.describe = d.title;
              const titleEl = document.createElement("span");
              titleEl.className = "ex-title";
              titleEl.textContent = label;
              const kindEl = document.createElement("span");
              kindEl.className = "ex-kind " + it.kind;
              kindEl.textContent =
                it.kind === "pipeline" ? "PIPE" : it.kind === "filter" ? "FILT" : "EXPR";
              item.append(titleEl, kindEl);
              item.addEventListener("click", () => {
                selectExample(it.slug);
                searchEl.focus();
              });
              section.appendChild(item);
              itemEls.set(it.slug, item);
              orderedSlugs.push(it.slug);
            };

            if (d.its.length === 1) {
              renderItem(d.title, d.its[0]);
            } else {
              const sub = document.createElement("div");
              sub.className = "describe-heading";
              sub.textContent = d.title;
              section.appendChild(sub);
              for (const it of d.its) renderItem(it.title, it);
            }
          }

          frag.appendChild(section);
        }
        listEl.replaceChildren(frag);

        const allIts = [];
        for (const d of list) for (const it of d.its) allIts.push(it);
        const pipelines = allIts.filter((e) => e.kind === "pipeline").length;
        const filters = allIts.filter((e) => e.kind === "filter").length;
        const expressions = allIts.length - pipelines - filters;
        countEl.textContent = `${itCount} (${filters} filt · ${pipelines} pipe · ${expressions} expr)`;
      }

      function writeHash(slug) {
        if (slug) {
          if (location.hash === "#" + slug) return;
          history.replaceState(null, "", "#" + slug);
        } else {
          if (!location.hash) return;
          history.replaceState(null, "", location.pathname + location.search);
        }
      }

      function slugFromHash() {
        const raw = location.hash.slice(1);
        if (!raw) return null;
        try {
          return decodeURIComponent(raw);
        } catch {
          return raw;
        }
      }

      function selectExample(slug, { scroll = true } = {}) {
        const ex = examples.get(slug);
        if (!ex) return;
        activeSlug = slug;
        // Update the compile mode BEFORE `setValue` — the change-event-driven
        // `render()` fires synchronously inside `setValue`, so any state it
        // reads (compile mode, anything else that would change per-example)
        // must be in place first or the output panel renders the new input
        // with the OLD example's compile mode.
        currentCall = ex.call || "jsmql";
        loadingFromList = true;
        inputCm.setValue(ex.query);
        loadingFromList = false;
        // Belt-and-braces: explicitly re-render after every state update is
        // done. If `setValue` ever stops firing the change event (e.g. CM
        // optimises a no-op replaceRange), this guarantees the output panel
        // still reflects the freshly-selected example.
        render();

        currentTitleEl.textContent = ex.displayTitle;
        currentKindEl.hidden = false;
        currentKindEl.className = "kind-pill " + ex.kind;
        currentKindEl.textContent =
          ex.kind === "pipeline" ? "PIPELINE" : ex.kind === "filter" ? "FILTER" : "EXPRESSION";
        inputPanel.classList.remove("pipeline", "filter", "expression");
        inputPanel.classList.add(ex.kind);
        // Render the "how to call jsmql from MongoDB" hint below the editor
        // label. Pulled straight from the test's `// → db.<coll>.<method>(...)`
        // annotation so the playground always shows the example's real call
        // site — `db.users.find(jsmql(...))`, `db.orders.aggregate(jsmql(...))`,
        // or `db.users.updateOne({ _id: 123 }, jsmql.expr(...))` for the
        // Update Filter case.
        if (usageEl) {
          if (ex.usage) {
            usageEl.hidden = false;
            usageCodeEl.textContent = ex.usage;
          } else {
            usageEl.hidden = true;
            usageCodeEl.textContent = "";
          }
        }

        for (const [s, el] of itemEls) {
          el.classList.toggle("active", s === slug);
        }
        if (scroll) {
          const active = itemEls.get(slug);
          if (active) active.scrollIntoView({ block: "nearest" });
        }
        writeHash(slug);
      }

      // When the user freely edits the input, we no longer match a stored
      // example. Clear the active highlight so the sidebar reflects state.
      let loadingFromList = false;
      function clearActiveOnUserEdit() {
        if (loadingFromList || activeSlug == null) return;
        const ex = examples.get(activeSlug);
        if (!ex || inputCm.getValue() === ex.query) return;
        activeSlug = null;
        for (const el of itemEls.values()) el.classList.remove("active");
        currentTitleEl.textContent = "";
        currentKindEl.hidden = true;
        inputPanel.classList.remove("pipeline", "filter", "expression");
        if (usageEl) {
          usageEl.hidden = true;
          usageCodeEl.textContent = "";
        }
        writeHash(null);
      }

      // Set of currently-selected kind filters (`"filter"`, `"pipeline"`,
      // `"expression"`). Empty means "show all kinds". Clicking a legend item
      // toggles its kind in the set; the filter is unioned with the text
      // search.
      const selectedKinds = new Set();

      function filterList(rawQuery) {
        const q = rawQuery.trim().toLowerCase();
        visibleSlugs = [];
        let anyVisible = false;
        for (const groupEl of listEl.querySelectorAll(".cat-group")) {
          let groupHasMatch = false;
          // Track which `.describe-heading` sub-headers belong to which it
          // items — sub-headers are siblings, not children, so we toggle
          // their visibility based on whether ANY item beneath them matches.
          // Simpler: hide all sub-headers, then re-show ones whose immediate
          // following items include a match.
          const subHeaders = groupEl.querySelectorAll(".describe-heading");
          for (const sub of subHeaders) sub.hidden = true;
          for (const item of groupEl.querySelectorAll(".example-item")) {
            const slug = item.dataset.slug;
            const ex = examples.get(slug);
            const haystack =
              (ex.displayTitle || "").toLowerCase() +
              " " +
              (ex.describeTitle || "").toLowerCase() +
              " " +
              (ex.features || []).join(" ").toLowerCase() +
              " " +
              ex.kind +
              " " +
              ex.query.toLowerCase();
            const textMatch = q === "" || haystack.includes(q);
            const kindMatch = selectedKinds.size === 0 || selectedKinds.has(ex.kind);
            const match = textMatch && kindMatch;
            item.hidden = !match;
            if (match) {
              visibleSlugs.push(slug);
              groupHasMatch = true;
              // Walk backward to find the nearest `.describe-heading` and
              // un-hide it (so multi-it groups still show their sub-header
              // when any of their its matches the filter).
              let prev = item.previousElementSibling;
              while (prev && !prev.classList.contains("describe-heading")) {
                if (prev.classList.contains("example-item")) break;
                prev = prev.previousElementSibling;
              }
              if (prev && prev.classList.contains("describe-heading")) prev.hidden = false;
            }
          }
          groupEl.hidden = !groupHasMatch;
          if (groupHasMatch) anyVisible = true;
        }
        noMatchesEl.hidden = anyVisible;
      }

      // Wire up the kind-filter toggle pills under the search box.
      for (const legendBtn of document.querySelectorAll(".legend .legend-item")) {
        legendBtn.addEventListener("click", () => {
          const kind = legendBtn.dataset.kind;
          if (selectedKinds.has(kind)) selectedKinds.delete(kind);
          else selectedKinds.add(kind);
          legendBtn.classList.toggle("active", selectedKinds.has(kind));
          legendBtn.setAttribute("aria-pressed", selectedKinds.has(kind) ? "true" : "false");
          filterList(searchEl.value);
          // Re-focus the search box so the user's ↑/↓ keys keep stepping
          // through the filtered list without an explicit click.
          searchEl.focus();
        });
      }

      function stepSelection(dir) {
        if (visibleSlugs.length === 0) return;
        const idx = activeSlug ? visibleSlugs.indexOf(activeSlug) : -1;
        let next;
        if (idx === -1) {
          next = dir > 0 ? 0 : visibleSlugs.length - 1;
        } else {
          next = (idx + dir + visibleSlugs.length) % visibleSlugs.length;
        }
        selectExample(visibleSlugs[next]);
      }

      searchEl.addEventListener("input", () => filterList(searchEl.value));
      searchEl.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          stepSelection(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          stepSelection(-1);
        }
      });

      // ⌘K / Ctrl+K focuses the example search from anywhere.
      // ⌘B / Ctrl+B toggles the sidebar.
      window.addEventListener("keydown", (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (!mod) return;
        const key = e.key.toLowerCase();
        if (key === "k") {
          e.preventDefault();
          // ⌘K means "go find an example" — auto-reveal the sidebar if it
          // was collapsed, otherwise focusing a `display: none` input is
          // a silent no-op.
          if (mainEl.classList.contains("sidebar-collapsed")) toggleSidebar();
          searchEl.focus();
          searchEl.select();
        } else if (key === "b") {
          e.preventDefault();
          toggleSidebar();
        }
      });

      function toggleSidebar() {
        const collapsed = mainEl.classList.toggle("sidebar-collapsed");
        toggleSidebarLabel.textContent = collapsed ? "Show examples" : "Hide examples";
        // CodeMirror caches the gutter width when first laid out; force a
        // refresh after the grid columns change so the editors re-measure.
        requestAnimationFrame(() => {
          inputCm.refresh();
          outputCm.refresh();
        });
      }
      toggleSidebarBtn.addEventListener("click", toggleSidebar);

      let errorMarker = null;
      function clearErrorMarker() {
        if (errorMarker) {
          errorMarker.clear();
          errorMarker = null;
        }
      }

      function highlightErrorAt(pos) {
        clearErrorMarker();
        const src = inputCm.getValue();
        if (src.length === 0) return;
        // Clamp positions past end-of-input back to the last character so the
        // marker is always visible (e.g. unterminated `$.x &&` points just
        // beyond the source).
        const safePos = Math.min(pos, src.length - 1);
        const from = inputCm.posFromIndex(safePos);
        const to = inputCm.posFromIndex(safePos + 1);
        errorMarker = inputCm.markText(from, to, { className: "cm-error-marker" });
      }

      // Fit-or-break JSON pretty-printer: keep nodes on one line up to 80
      // cols, only expanding when the compact form would overflow.
      function pretty(root) {
        const compact = (x) =>
          Array.isArray(x)
            ? "[" + x.map(compact).join(", ") + "]"
            : x && typeof x === "object"
              ? Object.keys(x).length
                ? "{ " +
                  Object.keys(x)
                    .map((k) => JSON.stringify(k) + ": " + compact(x[k]))
                    .join(", ") +
                  " }"
                : "{}"
              : JSON.stringify(x);
        const go = (v, i, c) => {
          const s = compact(v);
          if (c + s.length <= 80) return s;
          const pad = " ".repeat(i + 2);
          const close = "\n" + " ".repeat(i);
          if (Array.isArray(v))
            return "[\n" + v.map((x) => pad + go(x, i + 2, i + 2)).join(",\n") + close + "]";
          return (
            "{\n" +
            Object.keys(v)
              .map((k) => {
                const p = JSON.stringify(k) + ": ";
                return pad + p + go(v[k], i + 2, i + 2 + p.length);
              })
              .join(",\n") +
            close +
            "}"
          );
        };
        return go(root, 0, 0);
      }

      function render() {
        clearActiveOnUserEdit();
        const src = inputCm.getValue();
        if (src.trim() === "") {
          clearErrorMarker();
          outputCm.setValue("");
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputPanel.classList.remove("error");
          // Empty editor is a fresh start — drop the sticky `jsmql.expr`
          // mode so the next thing the user types compiles as a Filter /
          // Pipeline by default, not a partial expression.
          currentCall = "jsmql";
          return;
        }
        const result = jsmql.validate(src);
        if (result.valid) {
          clearErrorMarker();
          // Dispatch to the same entry point the active example used. Without
          // this the Expression examples (jsmql.expr-authored) would render
          // their output through `jsmql()` and pick up the find-filter wrap —
          // `{ $expr: <agg> }` instead of the bare aggregation expression the
          // test asserts. See docs/specs/filter-mode.md for the dispatch.
          const compile = currentCall === "jsmql.expr" ? jsmql.expr : jsmql;
          const out = compile(src);
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputCm.setValue(prettify.checked ? pretty(out) : JSON.stringify(out));
          outputPanel.classList.remove("error");
        } else {
          const e = result.errors[0];
          // CODEGEN_ERROR carries pos: 0 as a placeholder, not a real
          // location — only highlight when the position is meaningful.
          if (e.code === "SYNTAX_ERROR") highlightErrorAt(e.pos);
          else clearErrorMarker();
          outputCm.setOption("mode", null);
          outputCm.setValue(`${e.code} at position ${e.pos}\n\n${e.message}`);
          outputPanel.classList.add("error");
        }
      }

      inputCm.on("change", render);
      prettify.addEventListener("change", render);

      let copyResetTimer = null;
      copyBtn.addEventListener("click", async () => {
        const text = outputCm.getValue();
        if (text === "" || outputPanel.classList.contains("error")) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied!";
        } catch {
          copyBtn.textContent = "Copy failed";
        }
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          copyBtn.textContent = "Copy";
        }, 1200);
      });

      populateExamples();
      filterList("");
      window.addEventListener("hashchange", () => {
        const slug = slugFromHash();
        if (slug && examples.has(slug) && slug !== activeSlug) {
          selectExample(slug, { scroll: true });
        }
      });
      if (orderedSlugs.length > 0) {
        const initialSlug = slugFromHash();
        const startSlug =
          initialSlug && examples.has(initialSlug) ? initialSlug : orderedSlugs[0];
        selectExample(startSlug, { scroll: initialSlug != null });
      }
    </script>
