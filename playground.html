<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jsmql playground</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #666;
        --bg: #fafafa;
        --panel: #fff;
        --border: #e2e2e2;
        --accent: #2a6df4;
        --error: #c0392b;
        --error-bg: #fdf3f2;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      header strong {
        font-size: 14px;
      }

      header .tag {
        color: var(--muted);
      }

      header a {
        color: var(--accent);
        text-decoration: none;
      }

      header a:hover {
        text-decoration: underline;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        background: var(--panel);
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid var(--border);
      }

      .label {
        padding: 6px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .label label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: none;
        letter-spacing: normal;
        font-size: 11px;
        cursor: pointer;
      }

      .label input[type="checkbox"] {
        margin: 0;
      }

      .label select {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 4px;
        max-width: 320px;
      }

      .label button {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
      }

      .label button:hover {
        background: var(--bg);
      }

      .label button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .label .controls {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #output {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .CodeMirror {
        flex: 1;
        min-height: 0;
        height: auto;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
      }

      .CodeMirror-lines {
        padding: 14px 0;
      }

      pre.CodeMirror-line,
      pre.CodeMirror-line-like {
        padding-left: 16px;
        padding-right: 16px;
      }

      .panel.error .CodeMirror {
        background: var(--error-bg);
        color: var(--error);
        border-left: 3px solid var(--error);
      }

      .panel.error .CodeMirror-line,
      .panel.error .CodeMirror-line span {
        color: var(--error) !important;
      }

      .cm-error-marker {
        background: rgba(192, 57, 43, 0.18);
        border-bottom: 2px solid var(--error);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>jsmql playground</strong>
      <span class="tag">type an expression on the left, see the compiled MQL on the right</span>
      <a href="docs/LANGUAGE.md">syntax reference</a>
    </header>
    <main>
      <section class="panel">
        <div class="label">
          <span>jsmql input</span>
          <label
            >Examples
            <select id="example" disabled></select>
          </label>
        </div>
        <textarea
          id="input"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          autofocus
        ></textarea>
      </section>
      <section class="panel" id="output-panel">
        <div class="label">
          <span>MQL output (JSON)</span>
          <span class="controls">
            <label><input type="checkbox" id="prettify" checked /> Prettify</label>
            <button type="button" id="copy">Copy</button>
          </span>
        </div>
        <div id="output"></div>
      </section>
    </main>

          const close = "\n" + " ".repeat(i);
          if (Array.isArray(v))
            return "[\n" + v.map((x) => pad + go(x, i + 2, i + 2)).join(",\n") + close + "]";
          return (
            "{\n" +
            Object.keys(v)
              .map((k) => {
                const p = JSON.stringify(k) + ": ";
                return pad + p + go(v[k], i + 2, i + 2 + p.length);
              })
              .join(",\n") +
            close +
            "}"
          );
        };
        return go(root, 0, 0);
      }

      function render() {
        const src = inputCm.getValue();
        if (src.trim() === "") {
          clearErrorMarker();
          outputCm.setValue("");
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputPanel.classList.remove("error");
          return;
        }
        const result = jsmql.validate(src);
        if (result.valid) {
          clearErrorMarker();
          const out = jsmql(src);
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputCm.setValue(prettify.checked ? pretty(out) : JSON.stringify(out));
          outputPanel.classList.remove("error");
        } else {
          const e = result.errors[0];
          // CODEGEN_ERROR carries pos: 0 as a placeholder, not a real
          // location — only highlight when the position is meaningful.
          if (e.code === "SYNTAX_ERROR") highlightErrorAt(e.pos);
          else clearErrorMarker();
          outputCm.setOption("mode", null);
          outputCm.setValue(`${e.code} at position ${e.pos}\n\n${e.message}`);
          outputPanel.classList.add("error");
        }
      }

      inputCm.on("change", render);
      prettify.addEventListener("change", render);
      example.addEventListener("change", () => {
        inputCm.setValue(loadExample(example.value));
      });

      let copyResetTimer = null;
      copyBtn.addEventListener("click", async () => {
        const text = outputCm.getValue();
        if (text === "" || outputPanel.classList.contains("error")) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied!";
        } catch {
          copyBtn.textContent = "Copy failed";
        }
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          copyBtn.textContent = "Copy";
        }, 1200);
      });

      populateExamples();
      inputCm.setValue(loadExample(example.value));
    </script>
  </body>
</html>
