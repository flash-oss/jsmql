<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mjsql playground</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #666;
        --bg: #fafafa;
        --panel: #fff;
        --border: #e2e2e2;
        --accent: #2a6df4;
        --error: #c0392b;
        --error-bg: #fdf3f2;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      header strong {
        font-size: 14px;
      }

      header .tag {
        color: var(--muted);
      }

      header a {
        color: var(--accent);
        text-decoration: none;
      }

      header a:hover {
        text-decoration: underline;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        background: var(--panel);
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid var(--border);
      }

      .label {
        padding: 6px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .label label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: none;
        letter-spacing: normal;
        font-size: 11px;
        cursor: pointer;
      }

      .label input[type="checkbox"] {
        margin: 0;
      }

      .label select {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 4px;
        max-width: 320px;
      }

      .label button {
        font-family: inherit;
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
      }

      .label button:hover {
        background: var(--bg);
      }

      .label button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .label .controls {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #output {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .CodeMirror {
        flex: 1;
        min-height: 0;
        height: auto;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
      }

      .CodeMirror-lines {
        padding: 14px 0;
      }

      pre.CodeMirror-line,
      pre.CodeMirror-line-like {
        padding-left: 16px;
        padding-right: 16px;
      }

      .panel.error .CodeMirror {
        background: var(--error-bg);
        color: var(--error);
        border-left: 3px solid var(--error);
      }

      .panel.error .CodeMirror-line,
      .panel.error .CodeMirror-line span {
        color: var(--error) !important;
      }

      .cm-error-marker {
        background: rgba(192, 57, 43, 0.18);
        border-bottom: 2px solid var(--error);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>mjsql playground</strong>
      <span class="tag">type an expression on the left, see the compiled MQL on the right</span>
      <a href="docs/LANGUAGE.md">syntax reference</a>
    </header>
    <main>
      <section class="panel">
        <div class="label">
          <span>mjsql input</span>
          <label
            >Examples
            <select id="example">
              <option value="free-shipping">E-commerce: free shipping eligibility</option>
              <option value="loyalty-discount">E-commerce: tiered loyalty discount</option>
              <option value="cart-subtotal">E-commerce: cart subtotal (.map + .reduce)</option>
              <option value="email-domain">Analytics: email domain extraction</option>
              <option value="url-slug">Content: URL slug</option>
              <option value="last-login">
                Analytics: days since last login (?? + escape hatch)
              </option>
              <option value="address">
                Location: full address formatter (filter + map + reduce)
              </option>
              <option value="greeting">Modern JS: invoice greeting (template literal + ?.)</option>
              <option value="tags">Reporting: tag aggregation (.flat + .join)</option>
              <option value="underwriting">
                Insurance: annotated underwriting rule (with comments)
              </option>
              <option value="top-orders">Pipeline: top-orders by department</option>
              <option value="histogram" selected>
                Pipeline: dynamic-keyed histogram via $reduce
              </option>
              <option value="invoice-finalisation">
                Pipeline: invoice finalisation (mutations + $match)
              </option>
            </select>
          </label>
        </div>
        <textarea
          id="input"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          autofocus
        ></textarea>
      </section>
      <section class="panel" id="output-panel">
        <div class="label">
          <span>MQL output (JSON)</span>
          <span class="controls">
            <label><input type="checkbox" id="prettify" checked /> Prettify</label>
            <button type="button" id="copy">Copy</button>
          </span>
        </div>
        <div id="output"></div>
      </section>
    </main>

    <script type="text/plain" data-ex="free-shipping">
      $.cart.total >= 50 &&
      $.customer.status in ["premium", "gold", "platinum"] &&
      $.cart.items.length < 20 &&
      $.customer.region.trim().toLowerCase() == "us"
    </script>

    <script type="text/plain" data-ex="loyalty-discount">
      $round(
        $.price * (
          $.loyalty.years >= 5 && $.loyalty.totalSpend >= 10000 ? 0.85 :
          $.loyalty.years >= 2 ? 0.92 : 1
        ),
        2
      )
    </script>

    <script type="text/plain" data-ex="cart-subtotal">
      $.items.map(item => item.qty * item.price).reduce((acc, x) => acc + x, 0)
    </script>

    <script type="text/plain" data-ex="email-domain">
      $.email.split("@").at(1).toLowerCase()
    </script>

    <script type="text/plain" data-ex="url-slug">
      String($.articleId) + "-" + $.title.toLowerCase().trim().replaceAll(" ", "-")
    </script>

    <script type="text/plain" data-ex="last-login">
      Math.abs($dateDiff({ startDate: $.lastLoginAt, endDate: new Date(), unit: 'day' }) ?? -1)
    </script>

    <script type="text/plain" data-ex="address">
      [
        typeof $.building === "string" && $.building.trim() !== "" ? $.building.trim() + "," : null,
        $.streetNo, $.street, $.suburb, $.state, $.country, $.postcode,
      ]
        .filter((x) => typeof x === "string" && x !== "")
        .map((x) => x.trim())
        .join(" ")
    </script>

    <script type="text/plain" data-ex="greeting">
      `Hi ${$.customer?.firstName ?? 'there'} — your ${$.invoice.id.startsWith('INV-VIP-') ? 'VIP ' : ''}invoice ${$.invoice.id} is ready`
    </script>

    <script type="text/plain" data-ex="tags">
      $.posts.map(p => p.tags).flat().join(", ")
    </script>

    <script type="text/plain" data-ex="underwriting">
      // age window: 25 to 70 inclusive
      $.driver.age >= 25 && $.driver.age <= 70 &&

      /* annual mileage cap — 30k km/year keeps us out of commercial-fleet pricing */
      $.policy.kmPerYear <= 30_000 &&

      // hard-list occupations that bump the applicant to the high-risk tier
      !($.driver.occupation in ["stunt-double", "test-pilot", "demolition-engineer"])
    </script>

    <script type="text/plain" data-ex="top-orders">
      [
        $match($.status === "shipped" && $.placedAt >= "2026-01-01"),
        $lookup({ from: "users", localField: "userId", foreignField: "_id", as: "buyer" }),
        $unwind($.buyer),
        $group({ _id: $.buyer.department, revenue: $sum($.total), orders: $sum(1) }),
        $set({ avgOrder: $.revenue / $.orders }),
        $sort({ revenue: -1 }),
        $limit(3)
      ]
    </script>

    <script type="text/plain" data-ex="histogram">
      [
        { $group: { _id: $.shopId, statuses: $push($.status) } },
        { $project: {
            counts: $.statuses.reduce((acc, s) => ({ ...acc, [s]: (acc[s] ?? 0) + 1 }), {})
        } }
      ]
    </script>

    <script type="text/plain" data-ex="invoice-finalisation">
      [
        $match($.status === 'pending' && $.paidAt != null),
        $.lineTotal = $.qty * $.unitPrice,
        $.invoiceCount += 1,
        delete $.tempToken,
        delete $._processingState,
        $.status = 'complete'
      ]
    </script>

    <script type="module">
      import { mjsql, validate } from "./dist/index.js";

      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const outputPanel = document.getElementById("output-panel");
      const prettify = document.getElementById("prettify");
      const example = document.getElementById("example");
      const copyBtn = document.getElementById("copy");

      const inputCm = CodeMirror.fromTextArea(inputEl, {
        mode: { name: "javascript" },
        theme: "neo",
        lineWrapping: true,
        tabSize: 2,
        indentUnit: 2,
      });

      const outputCm = CodeMirror(outputEl, {
        mode: { name: "javascript", json: true },
        theme: "neo",
        lineWrapping: true,
        readOnly: "nocursor",
        value: "",
      });

      function loadExample(key) {
        const block = document.querySelector(`script[data-ex="${key}"]`);
        if (!block) return "";
        const raw = block.textContent.replace(/^\n/, "").replace(/\n\s*$/, "");
        // The HTML formatter indents the contents of these blocks; strip the
        // common leading-whitespace prefix so the example shows up unindented.
        const lines = raw.split("\n");
        let minIndent = Infinity;
        for (const line of lines) {
          if (line.trim() === "") continue;
          const m = line.match(/^( *)/);
          if (m) minIndent = Math.min(minIndent, m[1].length);
        }
        if (!Number.isFinite(minIndent) || minIndent === 0) return raw;
        return lines.map((l) => l.slice(minIndent)).join("\n");
      }

      let errorMarker = null;
      function clearErrorMarker() {
        if (errorMarker) {
          errorMarker.clear();
          errorMarker = null;
        }
      }

      function highlightErrorAt(pos) {
        clearErrorMarker();
        const src = inputCm.getValue();
        if (src.length === 0) return;
        // Clamp positions past end-of-input back to the last character so the
        // marker is always visible (e.g. unterminated `$.x &&` points just
        // beyond the source).
        const safePos = Math.min(pos, src.length - 1);
        const from = inputCm.posFromIndex(safePos);
        const to = inputCm.posFromIndex(safePos + 1);
        errorMarker = inputCm.markText(from, to, { className: "cm-error-marker" });
      }

      function render() {
        const src = inputCm.getValue();
        if (src.trim() === "") {
          clearErrorMarker();
          outputCm.setValue("");
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputPanel.classList.remove("error");
          return;
        }
        const result = validate(src);
        if (result.valid) {
          clearErrorMarker();
          const indent = prettify.checked ? 2 : 0;
          outputCm.setOption("mode", { name: "javascript", json: true });
          outputCm.setValue(JSON.stringify(mjsql(src), null, indent));
          outputPanel.classList.remove("error");
        } else {
          const e = result.errors[0];
          // CODEGEN_ERROR carries pos: 0 as a placeholder, not a real
          // location — only highlight when the position is meaningful.
          if (e.code === "SYNTAX_ERROR") highlightErrorAt(e.pos);
          else clearErrorMarker();
          outputCm.setOption("mode", null);
          outputCm.setValue(`${e.code} at position ${e.pos}\n\n${e.message}`);
          outputPanel.classList.add("error");
        }
      }

      inputCm.on("change", render);
      prettify.addEventListener("change", render);
      example.addEventListener("change", () => {
        inputCm.setValue(loadExample(example.value));
      });

      let copyResetTimer = null;
      copyBtn.addEventListener("click", async () => {
        const text = outputCm.getValue();
        if (text === "" || outputPanel.classList.contains("error")) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied!";
        } catch {
          copyBtn.textContent = "Copy failed";
        }
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          copyBtn.textContent = "Copy";
        }, 1200);
      });

      inputCm.setValue(loadExample(example.value));
    </script>
  </body>
</html>
