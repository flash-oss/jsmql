# GitHub Pages publishes two artefacts: playground.html and the library bundle
# it imports, dist/jsmql.js. Only dist/jsmql.js is git-tracked under dist/ (see
# .gitignore), so the Pages checkout's dist/ holds just that one static .js file
# — copied verbatim (no front matter → no Liquid).
#
# Everything else (Markdown docs, TypeScript sources, configs, dotfiles) is
# excluded so Jekyll doesn't try to render it as Liquid — JS-syntax `{{ ... }}`
# blocks inside docs/LANGUAGE.md and docs/DEVLOG.md crash the build.

include:
  - playground.html

exclude:
  - "*.md"
  - "*.json"
  - "*.ts"
  - "*.mjs"
  - .claude
  - .idea
  - .npmrc
  - .nvmrc
  - .oxfmtrc.json
  - CLAUDE.md
  - README.md
  - docs
  - node_modules
  - scripts
  - src
  - test
  - vendor
  - vitest.config.ts
